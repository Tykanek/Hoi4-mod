l_english:

 pra_directorate_of_national_salvation: "Directorate of National Salvation"
 pra_directorate_of_national_salvation_desc: "The Senate is dissolved, the cabinet is under arrest and executive authority rests with the Directorate. Every institution in Prague now serves the city's survival and military security."
 pra_subordinated_administration: "Subordinated Administration"
 pra_subordinated_administration_desc: "Prague has abandoned complete sovereignty and reaffirmed the political settlement binding the city to the Czech state."
 pra_devotion_to_prague_treaty: "Devotion to the Prague Treaty"
 cze_loyal_prague_subject: "Loyal Prague Subject"
 pra_prague_claims_central_bohemia: "Prague's Claims on Central Bohemia"

 # ========================================================
 # ARMY BRANCH SPIRITS
 # ========================================================
 pra_capital_defence_doctrine_1: "Army of Prague"
 pra_capital_defence_doctrine_1_desc: "Prague cannot trade territory for time. Its soldiers learn to turn streets, courtyards and prepared positions into a compact urban fortress."
 pra_capital_defence_doctrine_2: "Army of Prague"
 pra_capital_defence_doctrine_2_desc: "Standardized rifles, ammunition and maintenance let Prague's infantry fight harder while consuming less of the supply that the city can least afford to waste."
 pra_army_of_the_capital: "Army of Prague"
 pra_army_of_the_capital_desc: "The Prague War School unites infantry, artillery and reserve columns around a single purpose: no ground surrendered inside the capital."
 pra_army_of_the_capital_barricades: "Army of Prague: Doctrine of the Barricades"
 pra_army_of_the_capital_barricades_desc: "Prague's army has turned prepared streets, bridges and courtyards into a coherent defensive doctrine."
 pra_army_of_the_capital_officer_school: "Army of Prague: Legionary Officer School"
 pra_army_of_the_capital_officer_school_desc: "Legionary veterans bring a professional staff culture and cheaper land-doctrine development to the capital's army."
 pra_army_of_the_capital_assault_groups: "Army of Prague: Metropolitan Assault Groups"
 pra_army_of_the_capital_assault_groups_desc: "The capital's defensive army now includes trained assault groups capable of breaking through urban strongpoints."
 pra_fortress_army: "Fortress Army"
 pra_fortress_army_desc: "Prague's army is built to hold the capital and its approaches through prepared positions, disciplined reserves and deep entrenchment."
 pra_field_army: "Field Army"
 pra_field_army_desc: "Prague's army has learned to carry its urban discipline beyond the city with faster planning and stronger infantry formations."

 # ========================================================
 # AIR FORCE BRANCH SPIRITS
 # ========================================================
 pra_prague_air_watch_1: "Prague Air Command"
 pra_prague_air_watch_1_desc: "Rooftop observers, telephone posts and hurried reports form Prague's first warning net against air raids."
 pra_prague_air_watch_2: "Prague Air Command"
 pra_prague_air_watch_2_desc: "Expanded posts around Letnany and Kbely give the capital more time to scramble its aircraft and warn its anti-aircraft crews."
 pra_integrated_prague_air_defence: "Prague Air Command"
 pra_integrated_prague_air_defence_desc: "Observers, fighters and anti-aircraft batteries now answer to one command, creating an integrated shield over the capital."

 # ========================================================
 # INDUSTRY BRANCH SPIRITS
 # ========================================================
 pra_fragmented_workshop_network: "Metropolitan War Economy"
 pra_fragmented_workshop_network_desc: "Prague's small machine shops, railway sheds and municipal repair halls are catalogued as one network, squeezing more production from scarce inputs."
 pra_modernized_workshop_network: "Metropolitan War Economy"
 pra_modernized_workshop_network_desc: "Standardized tools and centralized schedules allow the city's workshops to build efficiency while reducing the damage caused by missing resources."
 pra_arsenal_of_prague_spirit: "Metropolitan War Economy"
 pra_arsenal_of_prague_spirit_desc: "The capital's industrial network now operates with ruthless urban efficiency: every kilogram of steel, every machine and every hour must matter."
 pra_total_metropolitan_mobilization: "Metropolitan War Economy"
 pra_total_metropolitan_mobilization_desc: "The entire city has been mobilized: workshops, engineers and transport offices now serve a single metropolitan war economy."

 pra_directorate_consolidation: "The Directorate Consolidated"
 pra_directorate_consolidation_desc: "The old parties are dissolved, the ministries are brought to heel and Prague's emergency government begins to operate as a single command."
 pra_mohammedis_state: "Mohammedis' State"
 pra_mohammedis_state_desc: "The Directorate, army and food office answer to one colonel."
 pra_colonel_state: "The Colonel Is the State"
 pra_colonel_state_desc: "Mohammedis has turned the emergency Directorate into a permanent personal regime: efficient, mobilized and openly dependent on one man."

 # ========================================================
 # BENEŠOV SABOTAGE SPIRITS
 # ========================================================
 ben_matej_dvorak_getting_everyone_drunk:0 "Matej Dvorak Responsible for Getting Everyone Drunk"
 ben_matej_dvorak_getting_everyone_drunk_desc:0 "A systematic investigation has concluded that Matej Dvorak bears direct responsibility for an alarming decline in sobriety across Beneshov. The resulting demographic consequences are considered severe."
