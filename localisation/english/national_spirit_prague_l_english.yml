l_english:

 pra_cut_off_from_hinterland: "Cut Off from the Hinterland"
 pra_cut_off_from_hinterland_desc: "The declaration of sovereignty has severed Prague from many of the agricultural and coal routes on which the city depends. Warehouses are emptying and industry is beginning to feel the consequences."

 pra_vo_rationing_network: "VO Rationing Network"
 pra_vo_rationing_network_desc: "The Vltava Defense Front has taken control of several major warehouses and distribution centres. Supplies remain scarce, but increasing numbers of Prague citizens now depend upon the VO rather than the Senate for their daily necessities."

 pra_vltava_defense_front: "Vltava Defense Front"
 pra_vltava_defense_front_desc: "Established as a volunteer civil-defense organization, the Vltava Defense Front has rapidly developed into a disciplined paramilitary movement centered around Colonel Peter Mohammedis."

 pra_directorate_of_national_salvation: "Directorate of National Salvation"
 pra_directorate_of_national_salvation_desc: "The provisional Senate has been dissolved and executive authority concentrated in the Directorate. Every institution of Prague is now expected to serve the survival and military security of the city."

 pra_subordinated_administration: "Subordinated Administration"
 pra_subordinated_administration_desc: "Prague has abandoned its bid for complete sovereignty and reaffirmed the political settlement binding it to the Czech state."
 pra_devotion_to_prague_treaty: "Devotion to the Prague Treaty"
