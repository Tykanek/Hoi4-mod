l_english:
 pra_ben_bidding_war_category:0 "The Bidding War for Lukas Elbl"
 pra_ben_bidding_war_category_desc:0 "Lukas Elbl has become the subject of an increasingly expensive contest between Prague and Beneshov. Neither government is willing to back down, and both continue to raise their offers. When the bidding closes on 1 September 1939, the highest bidder will secure his services as Field Marshal."

 pra_bidding_war_pra_icon_val:0 "[?global.pra_bidding_offer|0H]"
 pra_bidding_war_pra_icon_desc:0 "Prague has offered [?global.pra_bidding_offer|0] Billion for the contract of Lukas Elbl.\n"
 pra_bidding_war_ben_icon_val:0 "[?global.ben_bidding_offer|0H]"
 pra_bidding_war_ben_icon_desc:0 "Beneshov has offered [?global.ben_bidding_offer|0] Billion for the contract of Lukas Elbl.\n"

 pra_bidding_war_pra_offer_display:0 "[PRA.GetFlag] [?global.pra_bidding_offer|0H] Billion"
 pra_bidding_war_vs:0 "VS"
 pra_bidding_war_ben_offer_display:0 "[?global.ben_bidding_offer|0H] Billion [BEN.GetFlag]"
 pra_bidding_war_status_tt:0 "Status: [GetBiddingWarLeaderStatus]"

 pra_bidding_war_pra_leads:0 "Prague currently holds the highest offer to Lukas Elbl."
 pra_bidding_war_ben_leads:0 "Beneshov currently holds the highest offer to Lukas Elbl."
 pra_bidding_war_tied:0 "Both governments are currently offering Lukas Elbl the exact same amount."

 pra_increase_bidding_offer:0 "Offer Elbl Another Five Billion"
 pra_increase_bidding_offer_desc:0 "Our rival remains in the competition for Lukas Elbl's signature. Another five billion added to his contract should make our intentions perfectly clear."
 ben_increase_bidding_offer:0 "Offer Elbl Another Five Billion"
 ben_increase_bidding_offer_desc:0 "Our rival remains in the competition for Lukas Elbl's signature. Another five billion added to his contract should make our intentions perfectly clear."

 pra_bidding_offer_increase_tt:0 "Our offer to Lukas Elbl increases by 5 Billion."
 ben_bidding_offer_increase_tt:0 "Our offer to Lukas Elbl increases by 5 Billion."

 PRA_BEN_shared_field_marshal:0 "Lukas Elbl"
 PRA_BEN_shared_field_marshal_desc:0 "Lukas Elbl is a renowned military commander whose operational planning and logistics mastery made his contract the subject of an unprecedented financial bidding war between Prague and Beneshov."

 pra_ben_bidding_war.1.t:0 "The Most Expensive Marshal in Europe"
 pra_ben_bidding_war.1.d:0 "The bidding is over. After years of increasingly irresponsible offers, Prague has finally outbid Beneshov for the services of Lukas Elbl. With a final offer of [?global.pra_bidding_offer|0] Billion compared to Beneshov's [?global.ben_bidding_offer|0] Billion, Elbl has signed the contract and will enter Prague's armed forces as Field Marshal.\n\nOfficials have declined to explain how the Directorate intends to pay him."
 pra_ben_bidding_war.1.a:0 "A sound strategic contract."

 pra_ben_bidding_war.2.t:0 "Elbl Signs With Prague"
 pra_ben_bidding_war.2.d:0 "The bidding war for Lukas Elbl has concluded. Prague submitted a final contract offer of [?global.pra_bidding_offer|0] Billion, surpassing our offer of [?global.ben_bidding_offer|0] Billion. Lukas Elbl has accepted Prague's contract and entered their armed forces as Field Marshal."
 pra_ben_bidding_war.2.a:0 "Unfortunate, but our municipal treasury was already in ruins."

 pra_ben_bidding_war.3.t:0 "The Most Expensive Marshal in Europe"
 pra_ben_bidding_war.3.d:0 "Against every reasonable expectation of Beneshov's finances, the government has submitted the highest offer for Lukas Elbl. With a final bid of [?global.ben_bidding_offer|0] Billion against Prague's [?global.pra_bidding_offer|0] Billion, Elbl has signed the contract and will enter Beneshov's armed forces as Field Marshal.\n\nThe treasury has raised several objections. None were considered relevant."
 pra_ben_bidding_war.3.a:0 "Victory belongs to those who bid the highest."

 pra_ben_bidding_war.4.t:0 "Elbl Signs With Beneshov"
 pra_ben_bidding_war.4.d:0 "The bidding war for Lukas Elbl has concluded. Beneshov submitted an astronomical final offer of [?global.ben_bidding_offer|0] Billion, surpassing our offer of [?global.pra_bidding_offer|0] Billion. Lukas Elbl has accepted Beneshov's contract and entered their armed forces as Field Marshal."
 pra_ben_bidding_war.4.a:0 "How did a provincial town outbid our capital?"

 pra_ben_bidding_war.5.t:0 "Elbl Rejects Both Offers"
 pra_ben_bidding_war.5.d:0 "After years of escalating bids, Prague and Beneshov have somehow arrived at the exact same number: [?global.pra_bidding_offer|0] Billion each. Presented with two equally extravagant contracts, Lukas Elbl has declined to sign either of them, refusing to enter military service under either flag.\n\nBoth governments are now attempting to explain why they spent three years bidding against one another for nothing."
 pra_ben_bidding_war.5.a:0 "A complete waste of everyone's time and paper."
