l_english:
 ben_count_what_remains:0 "Count What Remains"
 ben_count_what_remains_desc:0 "Before any credible recovery can be planned, local officials must take a rigorous inventory of every warehouse, workshop, and supply dump left in Benešov."
 ben_reopen_local_workshops:0 "Reopen the Local Workshops"
 ben_reopen_local_workshops_desc:0 "Small manufacturing workshops and repair facilities across the district have sat idle since shipments stopped. By mobilizing local craftsmen and restarting municipal boilers, basic manufacturing can resume."
 ben_localize_supply_contracts:0 "Localize the Supply Contracts"
 ben_localize_supply_contracts_desc:0 "Benešov's public administration and private enterprises cannot indefinitely wait on stalled deliveries from Prague. Contracts are systematically reassigned to regional producers and domestic craftsmen."
 ben_benesov_works_again:0 "Benešov Works Again"
 ben_benesov_works_again_desc:0 "With workshops humming and local supply lines functioning, industrial capacity can now be expanded to support municipal defense and steady employment."
 ben_economic_recovery:0 "Economic Recovery"
 ben_economic_recovery_desc:0 "Through relentless local improvisation and fiscal discipline, Benešov has broken the cycle of collapse, establishing an autonomous and stable economic foundation."

 ben_inventory_the_armories:0 "Inventory the Armories"
 ben_inventory_the_armories_desc:0 "Benešov's small armory contains rifles, carbines, and ammunition left behind by departing garrisons. A meticulous inspection will determine what is combat-ready and what requires repair."
 ben_organize_the_garrison:0 "Organize the Benešov Garrison"
 ben_organize_the_garrison_desc:0 "The scattered squads and local volunteers must be brought under a unified district command structure with regular training drills and defined duties."
 ben_local_supply_depots:0 "Local Supply Depots"
 ben_local_supply_depots_desc:0 "Without central depot backing, Benešov must construct decentralized local storage facilities to stockpile cartridges, rations, and uniforms directly near active units."
 ben_standardize_the_infantry:0 "Standardize the Infantry"
 ben_standardize_the_infantry_desc:0 "Uniform caliber distribution, standard infantry field gear, and systematic squad formations replace ad-hoc militias with dependable line infantry."
 ben_army_that_can_fight:0 "An Army That Can Fight"
 ben_army_that_can_fight_desc:0 "Having overcome logistical neglect and equipment shortages, the Benešov armed forces now possess the training, discipline, and cohesion required to hold their ground."

 ben_survey_the_airfields:0 "Survey the Airfields"
 ben_survey_the_airfields_desc:0 "District survey teams inspect rural landing strips and municipal meadows, grading the ground and laying out basic facilities for a permanent air detachment."
 ben_build_a_flight_school:0 "Build a Flight School"
 ben_build_a_flight_school_desc:0 "A fledgling air force cannot survive without qualified airmen. Benešov opens a municipal training school to recruit civilian pilots and instruct them in military aviation basics."
 ben_scrounge_for_aircraft:0 "Scrounge for Aircraft"
 ben_scrounge_for_aircraft_desc:0 "Procurement officers scour hangars, aero clubs, and repair yards across the region for discarded airframes, spare engines, and airworthy parts."
 ben_benesov_air_command:0 "Benešov Air Command"
 ben_benesov_air_command_desc:0 "Establishing an independent air headquarters centralizes flight planning, warning relays, and maintenance logistics under dedicated officers."
 ben_air_force_of_our_own:0 "An Air Force of Our Own"
 ben_air_force_of_our_own_desc:0 "What began as a collection of neglected airframes and grounded trainers has grown into a small but capable air corps ready to defend the skies over Benešov."
