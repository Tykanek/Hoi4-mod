l_english:
 ben_count_what_remains:0 "Count What Remains"
 ben_count_what_remains_desc:0 "Before any credible recovery can be planned, local officials must take a rigorous inventory of every warehouse, workshop, and supply dump left in Beneshov. With deliveries from Prague halted, we must know exactly what tools and raw materials we possess."
 ben_reopen_local_workshops:0 "Reopen Local Workshops"
 ben_reopen_local_workshops_desc:0 "Small manufacturing workshops and repair facilities across the district have sat shuttered since deliveries dried up. By mobilizing local craftsmen, clearing out neglected scrap, and firing up municipal boilers, basic manufacturing can resume."
 ben_restore_basic_infrastructure:0 "Restore Basic Infrastructure"
 ben_restore_basic_infrastructure_desc:0 "Beneshov's public works departments must restore degraded electrical connections, repair deteriorated road links, and stabilize regional transport conduits. Without basic municipal utilities, our reopened workshops cannot function efficiently."
 ben_localize_supply_contracts:0 "Localize Supply Contracts"
 ben_localize_supply_contracts_desc:0 "Beneshov's public administration and private enterprises cannot indefinitely wait on stalled deliveries from Prague. Contracts are systematically reassigned to regional producers, agricultural cooperatives, and domestic craftsmen."
 ben_standardize_local_production:0 "Standardize Local Production"
 ben_standardize_local_production_desc:0 "By introducing unified tooling standards and rationalizing workshop routines across the district, we begin eliminating the chaotic manufacturing discrepancies that paralyze output. Consistency in fasteners, dies, and castings is essential for sustainable production."
 ben_benesov_works_again:0 "Beneshov Works Again"
 ben_benesov_works_again_desc:0 "With workshops humming, electrical lines restored, and municipal supply chains functioning, industrial activity has stabilized across the district. While resources remain tight, our citizens are back at work and civic despair has begun to recede."
 ben_rebuild_civilian_industry:0 "Rebuild Civilian Industry"
 ben_rebuild_civilian_industry_desc:0 "Investing municipal reserves directly into productive machinery allows local cooperatives to establish a dedicated civilian manufacturing base. Producing our own textiles, cookware, and building materials restores normal commerce to the town."
 ben_expand_local_construction:0 "Expand Local Construction"
 ben_expand_local_construction_desc:0 "Mobilizing municipal labor battalions and brickyards provides the manpower and materials needed to accelerate structural repairs. Clearing ruined lots and expanding work floors creates space for future civic enterprises."
 ben_a_civilian_economy_again:0 "A Civilian Economy Again"
 ben_a_civilian_economy_again_desc:0 "Through persistent civic organization and dedicated workshop expansion, Beneshov's domestic commerce has finally regained steady ground. We have shed the acute paralysis of economic collapse, securing a dependable baseline for daily life."
 ben_convert_the_workshops:0 "Convert the Workshops"
 ben_convert_the_workshops_desc:0 "Select municipal metalworking facilities are re-equipped with precision lathes, casting tools, and cartridge presses. Shifting part of our artisanal capacity toward defense hardware lays the groundwork for a dedicated armaments industry."
 ben_expand_arms_production:0 "Expand Arms Production"
 ben_expand_arms_production_desc:0 "With tooling standardized and metal shipments secured through regional suppliers, our military workshops can operate continuous shifts, dramatically increasing daily equipment output."
 ben_benesov_arsenal:0 "The Beneshov Arsenal"
 ben_benesov_arsenal_desc:0 "Consolidating our weapons fabrication facilities into a unified district arsenal guarantees a steady, reliable supply of modern arms for our defense forces. Beneshov no longer depends on smuggled or salvaged weaponry to equip its defenders."
 ben_economic_recovery:0 "Economic Recovery"
 ben_economic_recovery_desc:0 "Through months of strict municipal rationing, workshop retooling, and relentless administrative improvisation, Beneshov has finally halted its economic freefall. Our district is by no means an industrial powerhouse, but for the first time since independence, our production lines can sustain a functional, self-sufficient baseline."

 ben_the_benesov_question:0 "The Beneshov Question"
 ben_the_benesov_question_desc:0 "The municipal council must determine whether Beneshov's autonomous status is merely a temporary crisis measure, a lasting constitutional arrangement, or the prelude to a deeper political transformation. As central Czechoslovak authority fractures, our district cannot afford indecision."
 ben_we_still_need_the_republic:0 "We Still Need the Republic"
 ben_we_still_need_the_republic_desc:0 "Isolated and economically strained, Beneshov cannot realistically survive outside the Czechoslovak constitutional framework. Pragmatism demands reaffirming our ties to Prague and preserving federal legality."
 ben_restore_czech_deliveries:0 "Restore Czech Deliveries"
 ben_restore_czech_deliveries_desc:0 "Administrative delegates travel to Prague to negotiate the immediate resumption of railway freight, raw materials, and factory machinery destined for Beneshov, restoring traditional economic stability."
 ben_reaffirm_the_prague_compact:0 "Reaffirm the Prague Compact"
 ben_reaffirm_the_prague_compact_desc:0 "By signing formal protocols with Czechoslovak authorities, the district administration secures legal guarantees for local administrative autonomy within the broader democratic republic."
 ben_return_to_the_republic:0 "Return to the Republic"
 ben_return_to_the_republic_desc:0 "Recognizing that Beneshov's long-term security and prosperity lie with a unified Czechoslovak state, the local administration voluntarily dissolves its separate authority, formally returning the district to the republic."
 ben_return_to_the_republic_tt:0 "Beneshov will formally reintegrate into Czechoslovakia, transferring all local administration and armed forces to Prague."
 ben_benesov_can_stand_alone:0 "Beneshov Can Stand Alone"
 ben_benesov_can_stand_alone_desc:0 "Mayor Dvorak's government formally asserts that our district possesses the administrative discipline, civic resolve, and local ingenuity necessary to govern itself. Independence is no longer an emergency expedient, but our declared future."
 ben_cut_the_last_czech_ties:0 "Cut the Last Czech Ties"
 ben_cut_the_last_czech_ties_desc:0 "For years, Beneshov relied on Czechoslovak supply shipments, municipal oversight, and federal institutions to stay afloat. Today, that administrative relationship is formally terminated. Federal inspectors and customs officials are escorted to the district border under municipal guard as Beneshov assumes sole responsibility for its own administration. Mayor Matej Dvorak insists that full independence can still be managed democratically through civic discipline and calm deliberation."
 ben_the_deliveries_have_stopped:0 "The Deliveries Have Stopped"
 ben_the_deliveries_have_stopped_desc:0 "Prague's reaction to our unilateral secession is immediate and unforgiving. Railway freights carrying Silesian coal, Slovak iron, and state flour have been halted at the district perimeter, leaving our warehouses empty and our workshops cold."
 ben_dvorak_promises_recovery:0 "Dvorak Promises Recovery"
 ben_dvorak_promises_recovery_desc:0 "Facing mounting public anxiety over empty shelves, Mayor Dvorak addresses the municipal council with calls for patience and civic duty. He insists that local contracts and strict budgeting will soon stabilize the district, urging citizens to avoid radicalism."
 ben_the_beer_rationing_question:0 "The Beer Rationing Question"
 ben_the_beer_rationing_question_desc:0 "With staple food and fuel stockpiles dwindling, the municipal council faces bitter debate over how to maintain public order. Rather than imposing harsh police curfews, Dvorak's administration heavily subsidizes communal tavern rations, betting that accessible beer will keep anxious citizens calm."
 ben_stepan_knows_everyone:0 "Stepan Knows Everyone"
 ben_stepan_knows_everyone_desc:0 "When official bureaucratic requisitions stall, Stepan Pospisil steps into the void. Drawing upon an extensive personal network spanning brewery draymen, warehouse foremen, and railway yard clerks, he quietly coordinates supplies that official municipal decrees cannot secure."
 ben_workers_in_the_back_rooms:0 "Workers in the Back Rooms"
 ben_workers_in_the_back_rooms_desc:0 "Beneath the fog of tavern smoke and over pints of subsidized beer, factory stewards and union delegates gather to discuss the district's deepening crisis. Respect for Town Hall is evaporating, replaced by an urgent appetite for organized direct action."
 ben_the_strategist_of_benesov:0 "The Strategist of Beneshov"
 ben_the_strategist_of_benesov_desc:0 "Years spent studying military treatises, operational logistics, and complex grand-strategy simulations have convinced Adam Pospisil that he understands the mechanics of war and statecraft far better than the old politicians. In crowded tavern halls, his diagrams, flowcharts, and confident rhetoric captivate desperate workers."
 ben_a_thousand_hours_of_experience:0 "A Thousand Hours of Experience"
 ben_a_thousand_hours_of_experience_desc:0 "Whether coordinating mock divisional deployments on paper or calculating theoretical supply throughputs to the last crate, Pospisil approaches politics with the unwavering confidence of someone who has mastered every variable in simulation. His supporters see in him a modern, scientific commander."
 ben_the_benesov_workers_congress:0 "The Beneshov Workers' Congress"
 ben_the_benesov_workers_congress_desc:0 "Delegates from every local workshop, rail yard, and civic utility convene in an emergency congress. With Adam Pospisil chairing the assembly, the congress passes resolutions declaring the municipal administration incompetent and demanding a radical restructuring of local governance."
 ben_dvorak_has_lost_the_streets:0 "Dvorak Has Lost the Streets"
 ben_dvorak_has_lost_the_streets_desc:0 "Coordinated strikes and mass demonstrations organized through Stepan's transport network have brought the municipal administration to a complete halt. Police detachments refuse orders to disperse the crowds, leaving Mayor Dvorak isolated inside Town Hall as authority slips into the streets."
 ben_pospisil_takes_command:0 "Pospisil Takes Command"
 ben_pospisil_takes_command_desc:0 "Accompanied by a vanguard of armed factory delegates, Adam Pospisil enters Town Hall to relieve the paralyzed council of its duties. Proclaiming the necessity of unified strategic leadership, he assumes executive control over the district."
 ben_the_peoples_republic_of_benesov:0 "The People's Republic of Beneshov"
 ben_the_peoples_republic_of_benesov_desc:0 "Red banners are raised over Masaryk Square as the revolutionary council formally proclaims the People's Republic of Beneshov. Dedicated to working-class mobilization, scientific operational planning, and socialist reconstruction, our new republic charts a bold, independent course."
 ben_we_have_read_the_meta:0 "We Have Read the Meta"
 ben_we_have_read_the_meta_desc:0 "Dismissing conventional military orthodoxy as the stale dogma of failed generals, Pospisil subjects our armed forces to hyper-rational operational analysis. Every infantry squad, support attachment, and logistics route is systematically reorganized according to principles of optimal combat efficiency."
 ben_every_citizen_a_strategist:0 "Every Citizen a Strategist"
 ben_every_citizen_a_strategist_desc:0 "Public education and worker training are overhauled to include mandatory instruction in tactical geometry, resource optimization, and operational planning. Even the humblest recruit is taught to understand their tactical role within the grand operational simulation."
 ben_stepans_distribution_network:0 "Stepan's Distribution Network"
 ben_stepans_distribution_network_desc:0 "Under Stepan Pospisil's direct supervision, informal tavern and freight connections are formalized into a comprehensive state distribution agency. Bypassing bureaucratic red tape, the network delivers raw materials directly where industry needs them most."
 ben_a_government_worthy_of_bohemia:0 "A Government Worthy of Bohemia"
 ben_a_government_worthy_of_bohemia_desc:0 "The People's Republic presents its scientific planning, social discipline, and productive harmony as proof that Beneshov represents the true vanguard of the Bohemian working class, contrasting our vigor with the decay of neighboring regimes."
 ben_the_pospisil_doctrine:0 "The Pospisil Doctrine"
 ben_the_pospisil_doctrine_desc:0 "Fusing rigid operational geometry with decentralized squad maneuver, the Pospisil Doctrine codifies our unique military philosophy into standard army regulations. Every commander is taught to calculate probabilities, economize force, and execute aggressive maneuvers with mathematical precision."
 ben_the_failure_of_the_old_republic:0 "The Failure of the Old Republic"
 ben_the_failure_of_the_old_republic_desc:0 "From the podium, revolutionary agitators dismantle the mythology of the First Czechoslovak Republic, highlighting its bourgeois corruption and military paralysis. If the Czech lands are to survive the coming storms, it will not be under the compromised flags of Prague."
 ben_benesov_will_not_remain_small:0 "Beneshov Will Not Remain Small"
 ben_benesov_will_not_remain_small_desc:0 "The revolutionary leadership asserts that our small republic cannot remain an isolated enclave forever. To safeguard our socialist achievements and secure vital resources, Beneshov must prepare to project its influence outward into the surrounding Bohemian countryside."
 ben_liberate_the_czech_workers:0 "Liberate the Czech Workers"
 ben_liberate_the_czech_workers_desc:0 "From the factories of Prague to the mining towns of northern Bohemia, the working people suffer under fractured and reactionary regimes. Proclaiming our revolutionary republic as the true vanguard of the Czech nation, Beneshov prepares its operational forces to spearhead national liberation."

 ben_inventory_the_armories:0 "Inventory the Armories"
 ben_inventory_the_armories_desc:0 "Beneshov's armories contain a chaotic assortment of rifles, carbines, and ammunition left behind by departing Czechoslovak garrisons. A meticulous inspection will determine what weapons are combat-ready and what requires urgent repair."
 ben_count_every_rifle:0 "Count Every Rifle"
 ben_count_every_rifle_desc:0 "Conducting a rigorous, district-wide serial census of all military stores ensures every functional bolt-action rifle, bayonet, and ammunition crate is accounted for, cataloged, and issued to active squads."
 ben_organize_the_garrison:0 "Organize the Beneshov Garrison"
 ben_organize_the_garrison_desc:0 "Scattered guard squads and local volunteers must be brought under a unified district command structure. Establishing clear chains of responsibility, duty rosters, and guard sectors replaces confusion with military order."
 ben_begin_proper_drills:0 "Begin Proper Drills"
 ben_begin_proper_drills_desc:0 "Enforcing strict parade-ground discipline, regular marksmanship practice, and company-level maneuvering transforms our motley civic guards into an organized fighting force capable of executing orders under fire."
 ben_create_an_officer_cadre:0 "Create an Officer Cadre"
 ben_create_an_officer_cadre_desc:0 "Selecting capable veterans and natural leaders from the ranks to undergo rigorous tactical instruction provides our garrison with reliable operational leadership. Without educated junior officers, coordinated field maneuvers remain impossible."
 ben_local_supply_depots:0 "Local Supply Depots"
 ben_local_supply_depots_desc:0 "Without central federal depot backing, Beneshov must construct decentralized local storage facilities to stockpile cartridges, field rations, and uniforms directly near active deployment sectors."
 ben_establish_a_quartermaster_corps:0 "Establish a Quartermaster Corps"
 ben_establish_a_quartermaster_corps_desc:0 "A formal logistics branch ensures that ammunition, rations, and replacement equipment reach frontline units without confusion or bureaucratic delays, keeping our defense units supplied in the field."
 ben_standardize_the_infantry:0 "Standardize the Infantry"
 ben_standardize_the_infantry_desc:0 "Uniform caliber distribution, standard infantry field kit, and systematic squad formations replace ad-hoc militia bands with dependable line infantry capable of synchronized defense."
 ben_rewrite_the_field_manuals:0 "Rewrite the Field Manuals"
 ben_rewrite_the_field_manuals_desc:0 "Replacing outdated, fragmented doctrines with clear tactical guidelines tailored to Beneshov's terrain and troop strength empowers commanders to plan maneuvers with confidence."
 ben_professionalize_the_garrison:0 "Professionalize the Garrison"
 ben_professionalize_the_garrison_desc:0 "Instituting permanent enlisted contracts, merit-based promotions, and comprehensive field exercises elevates our garrison from an ad-hoc territorial militia into a disciplined, professional army."
 ben_army_that_can_fight:0 "An Army That Can Fight"
 ben_army_that_can_fight_desc:0 "After months of painstaking inventories, parade-ground drills, improvised supply reforms, and junior officer schooling, the Beneshov garrison can finally claim to possess a cohesive military force. We may lack the heavy armaments of great powers, but our men are disciplined, supplied, and capable of holding their ground."

 ben_survey_the_airfields:0 "Survey the Airfields"
 ben_survey_the_airfields_desc:0 "District survey teams inspect rural landing strips and municipal pastures, grading the terrain and laying out basic markers for a permanent municipal air detachment."
 ben_clear_the_runways:0 "Clear the Runways"
 ben_clear_the_runways_desc:0 "Grading rough grass fields, clearing drainage ditches, and installing simple wind indicators transforms primitive cow pastures into functional, all-weather operational runways."
 ben_build_a_flight_school:0 "Build a Flight School"
 ben_build_a_flight_school_desc:0 "A fledgling air force cannot survive without qualified airmen. Beneshov opens a municipal training school to recruit civilian aviation enthusiasts and instruct them in military flight fundamentals."
 ben_train_the_first_pilots:0 "Train the First Pilots"
 ben_train_the_first_pilots_desc:0 "Under the guidance of veteran flight instructors, our first cohort of aviation cadets takes to the air, mastering formation flying, aerial reconnaissance, and basic gunnery."
 ben_scrounge_for_aircraft:0 "Scrounge for Aircraft"
 ben_scrounge_for_aircraft_desc:0 "Procurement teams scour private aero clubs, rural hangars, and repair yards across the region for discarded airframes, surplus trainers, and airworthy components."
 ben_standardize_spare_parts:0 "Standardize Spare Parts"
 ben_standardize_spare_parts_desc:0 "Cataloging compatible airframe components, engine gaskets, and propeller fittings reduces the chaotic maintenance bottlenecks that keep aircraft grounded."
 ben_rebuild_the_hangars:0 "Rebuild the Hangars"
 ben_rebuild_the_hangars_desc:0 "Constructing weather-sealed hangars, maintenance bays, and underground fuel storage facilities protects our fragile airframes from rain, rot, and ground hazards."
 ben_benesov_air_command:0 "Beneshov Air Command"
 ben_benesov_air_command_desc:0 "Establishing an independent air headquarters centralizes flight planning, visual warning relays, and maintenance logistics under dedicated operational officers."
 ben_organize_fighter_squadrons:0 "Organize Fighter Squadrons"
 ben_organize_fighter_squadrons_desc:0 "Grouping operational aircraft into cohesive fighter flights with designated flight leaders establishes our first true tactical air defense squadrons capable of intercepting intruders."
 ben_domestic_aircraft_workshops:0 "Domestic Aircraft Workshops"
 ben_domestic_aircraft_workshops_desc:0 "Specialized machine shops dedicated to airframe fabrication and engine overhauls ensure Beneshov no longer relies entirely on scrounged foreign aircraft components."
 ben_professional_pilot_corps:0 "Professional Pilot Corps"
 ben_professional_pilot_corps_desc:0 "A formalized flight syllabus, advanced instrument training, and regular tactical exercises provide our air force with skilled, battle-ready aviators capable of complex aerial combat."
 ben_air_force_of_our_own:0 "An Air Force of Our Own"
 ben_air_force_of_our_own_desc:0 "What began as a collection of neglected civilian trainers, scrounged spare parts, and bumpy grass pastures has matured into a small but organized municipal air arm. With certified flight instructors, operational hangars, and designated fighter flights, Beneshov can finally defend its own skies."

 ben_reaffirmed_czech_ties:0 "Reaffirmed Czechoslovak Ties"
 ben_loyal_to_republic:0 "Loyal to the Republic"
 ben_loyal_to_republic_desc:0 "Beneshov has reaffirmed its commitment and loyalty to the Republic."
 ben_declared_independence_opinion:0 "Declared Independence"
 ben_denounced_old_republic:0 "Denounced the Old Republic"
 ben_cut_ties:0 "Severed Czechoslovak Ties"
 ben_cze_conceded_moravia:0 "Conceded Moravia"
 ben_cze_rejected_moravia:0 "Refused to Cede Moravia"
 ben_cze_conceded_silesia:0 "Conceded Sudeten Silesia"
 ben_cze_rejected_silesia:0 "Refused to Cede Sudeten Silesia"

 # ============================================================
 # THE GREAT BENESHOV DEPRESSION RECOVERY FOCUSES (5)
 # ============================================================
 ben_emergency_accounting:0 "Emergency Accounting"
 ben_emergency_accounting_desc:0 "Before the government can repair the economy, it must first determine whether anyone actually knows how much money remains in it. Special counting commissions are dispatched to Town Hall basements to assemble the first honest ledger of municipal debt."
 ben_stabilize_the_treasury:0 "Stabilize the Treasury"
 ben_stabilize_the_treasury_desc:0 "Municipal coffers cannot endure endless uncontrolled deficits. By renegotiating interest rates with local lenders and freezing non-essential administrative spending, we can stem the worst fiscal hemorrhages."
 ben_restore_domestic_credit:0 "Restore Domestic Credit"
 ben_restore_domestic_credit_desc:0 "With basic municipal bookkeeping restored, the district bank can resume issuing modest credit lines to local bakeries, timber yards, and workshops, kickstarting domestic circulation."
 ben_rebuild_industrial_confidence:0 "Rebuild Industrial Confidence"
 ben_rebuild_industrial_confidence_desc:0 "Artisans and small factory owners must trust that their investments will not be wiped out by administrative panic. Clear price regulations and state-guaranteed purchase agreements will coax capital back into production."
 ben_end_the_great_beneshov_depression:0 "End the Great Beneshov Depression"
 ben_end_the_great_beneshov_depression_desc:0 "Through rigorous fiscal discipline, tireless municipal negotiation, and sheer stubbornness, the severe economic contraction is finally behind us. Beneshov's Great Depression is officially declared over."

 # ============================================================
 # POSPISIL EXPANSION FOCUSES (5)
 # ============================================================
 ben_claim_the_legacy_of_czechoslovakia:0 "Claim the Czech Legacy"
 ben_claim_the_legacy_of_czechoslovakia_desc:0 "Prague has collapsed into internal strife and reaction, abandoning its duty to the Czech people. As the only authentic workers' government in the republic, the People's Republic of Beneshov formally stakes its claim to lead the remaining Czech lands of Moravia, Sudeten Silesia, and Zaolzie."
 ben_reach_out_to_moravian_workers:0 "Reach Out to Moravian Workers"
 ben_reach_out_to_moravian_workers_desc:0 "The industrial centers of Moravia cannot be left in political limbo under a dying central administration. We extend our hand to the Moravian worker councils and deliver a formal demand to Prague: transfer administrative authority over Moravia to Beneshov immediately."
 ben_solidarity_with_eastern_workers:0 "Solidarity with Silesian Workers"
 ben_solidarity_with_eastern_workers_desc:0 "From the foundries of Opava to the coal deposits of Zaolzie, the working class of Czech Silesia awaits revolutionary leadership. We demand that the remnant authorities in Czechoslovakia surrender their claims over Sudeten Silesia and Zaolzie to the People's Republic."
 ben_workers_of_the_former_republic:0 "Consolidate the Czech Lands"
 ben_workers_of_the_former_republic_desc:0 "Having brought Moravia, Sudeten Silesia, and Zaolzie under our red banner, the historic Czech lands outside the Prague basin are finally secure and unified. We integrate these districts as full sovereign territory of the People's Republic."
 ben_the_beneshov_successor_state:0 "The Beneshov Successor State"
 ben_the_beneshov_successor_state_desc:0 "From the district boundary of Beneshov to the crest of the High Tatras, the working class has triumphed over disintegration, reaction, and civil collapse. We have established a new socialist Czechoslovak federation born of revolutionary victory. Beneshov stands unchallenged as the legitimate heart of the reborn state."

 ben_the_czechoslovak_workers_mandate:0 "The Czechoslovak Workers' Mandate"
 ben_the_czechoslovak_workers_mandate_desc:0 "With the Czech lands consolidated, our revolutionary mission expands across the historic boundaries of the old republic. The state failed, but its workers did not cease to belong to the same political struggle. The Slovak working class was abandoned by the old government and left vulnerable to foreign partition. We formally proclaim our revolutionary constitutional mandate over all of Slovakia."

 ben_enforce_the_workers_mandate:0 "Enforce the Workers' Mandate"
 ben_enforce_the_workers_mandate_desc:0 "Declarations on paper will not free the Slovak workers from their oppressors. We must mobilize the armed forces of the People's Republic and march east to break the reactionary grip on Bratislava, Kosice, and the southern plains. Every brigade is issued their battle standards: the liberation of Slovakia begins now."

 ben_demand_moravia_tt:0 "Sends a formal demand to Czechoslovakia to cede Moravia to Beneshov."
 ben_demand_silesia_tt:0 "Sends a formal demand to Czechoslovakia to cede Sudeten Silesia and Zaolzie to Beneshov."
