﻿l_english:
 ben_count_what_remains:0 "Count What Remains"
 ben_count_what_remains_desc:0 "Before any credible recovery can be planned, local officials must take a rigorous inventory of every warehouse, workshop, and supply dump left in Benešov."
 ben_reopen_local_workshops:0 "Reopen the Local Workshops"
 ben_reopen_local_workshops_desc:0 "Small manufacturing workshops and repair facilities across the district have sat idle since shipments stopped. By mobilizing local craftsmen and restarting municipal boilers, basic manufacturing can resume."
 ben_localize_supply_contracts:0 "Localize the Supply Contracts"
 ben_localize_supply_contracts_desc:0 "Benešov's public administration and private enterprises cannot indefinitely wait on stalled deliveries from Prague. Contracts are systematically reassigned to regional producers and domestic craftsmen."
 ben_benesov_works_again:0 "Benešov Works Again"
 ben_benesov_works_again_desc:0 "With workshops humming and local supply lines functioning, industrial capacity can now be expanded to support municipal defense and steady employment."
 ben_economic_recovery:0 "Economic Recovery"
 ben_economic_recovery_desc:0 "Through relentless local improvisation and fiscal discipline, Benešov has broken the cycle of collapse, establishing an autonomous and stable economic foundation."

 ben_inventory_the_armories:0 "Inventory the Armories"
 ben_inventory_the_armories_desc:0 "Benešov's small armory contains rifles, carbines, and ammunition left behind by departing garrisons. A meticulous inspection will determine what is combat-ready and what requires repair."
 ben_organize_the_garrison:0 "Organize the Benešov Garrison"
 ben_organize_the_garrison_desc:0 "The scattered squads and local volunteers must be brought under a unified district command structure with regular training drills and defined duties."
 ben_local_supply_depots:0 "Local Supply Depots"
 ben_local_supply_depots_desc:0 "Without central depot backing, Benešov must construct decentralized local storage facilities to stockpile cartridges, rations, and uniforms directly near active units."
 ben_standardize_the_infantry:0 "Standardize the Infantry"
 ben_standardize_the_infantry_desc:0 "Uniform caliber distribution, standard infantry field gear, and systematic squad formations replace ad-hoc militias with dependable line infantry."
 ben_army_that_can_fight:0 "An Army That Can Fight"
 ben_army_that_can_fight_desc:0 "Having overcome logistical neglect and equipment shortages, the Benešov armed forces now possess the training, discipline, and cohesion required to hold their ground."

 ben_survey_the_airfields:0 "Survey the Airfields"
 ben_survey_the_airfields_desc:0 "District survey teams inspect rural landing strips and municipal meadows, grading the ground and laying out basic facilities for a permanent air detachment."
 ben_build_a_flight_school:0 "Build a Flight School"
 ben_build_a_flight_school_desc:0 "A fledgling air force cannot survive without qualified airmen. Benešov opens a municipal training school to recruit civilian pilots and instruct them in military aviation basics."
 ben_scrounge_for_aircraft:0 "Scrounge for Aircraft"
 ben_scrounge_for_aircraft_desc:0 "Procurement officers scour hangars, aero clubs, and repair yards across the region for discarded airframes, spare engines, and airworthy parts."
 ben_benesov_air_command:0 "Benešov Air Command"
 ben_benesov_air_command_desc:0 "Establishing an independent air headquarters centralizes flight planning, warning relays, and maintenance logistics under dedicated officers."
 ben_air_force_of_our_own:0 "An Air Force of Our Own"
 ben_air_force_of_our_own_desc:0 "What began as a collection of neglected airframes and grounded trainers has grown into a small but capable air corps ready to defend the skies over Benešov."
ben_the_benesov_question:0 "The Benešov Question"
 ben_the_benesov_question_desc:0 "The local government must decide whether Benešov's autonomous status is a temporary emergency measure, a lasting political settlement, or merely the opening stage of a deeper transformation."
 ben_we_still_need_the_republic:0 "We Still Need the Republic"
 ben_we_still_need_the_republic_desc:0 "Isolated and economically strained, Benešov cannot realistically survive outside the Czechoslovak constitutional framework. Pragmatism demands reaffirming our ties to Prague."
 ben_restore_czech_deliveries:0 "Restore Czech Deliveries"
 ben_restore_czech_deliveries_desc:0 "Administrative delegates travel to Prague to negotiate the immediate resumption of railway freight, raw materials, and factory machinery destined for Benešov."
 ben_reaffirm_the_prague_compact:0 "Reaffirm the Prague Compact"
 ben_reaffirm_the_prague_compact_desc:0 "By signing formal protocols with Czechoslovak authorities, the district administration secures legal guarantees for local autonomy within the broader republic."
 ben_return_to_the_republic:0 "Return to the Republic"
 ben_return_to_the_republic_desc:0 "Recognizing that Benešov's long-term security and prosperity lie with a unified Czechoslovak state, the local administration voluntarily dissolves its separate authority and reunites with the republic."
 ben_return_to_the_republic_tt:0 "Benešov will formally reintegrate into Czechoslovakia, transferring all local administration and armed forces to Prague."
 ben_benesov_can_stand_alone:0 "Benešov Can Stand Alone"
 ben_benesov_can_stand_alone_desc:0 "Benešov has endured abandonment and economic neglect without collapsing. The municipal assembly declares that the town has the will and resilience to govern its own destiny."
 ben_cut_the_last_czech_ties:0 "Cut the Last Czech Ties"
 ben_cut_the_last_czech_ties_desc:0 "The time for subservience is over. Benešov formally repudiates Czechoslovak supervision, expels remaining federal inspectors, and proclaims full sovereign independence."
 ben_the_deliveries_have_stopped:0 "The Deliveries Have Stopped"
 ben_the_deliveries_have_stopped_desc:0 "Independence celebrations are swiftly replaced by cold reality. In retaliation for our departure, Czechoslovak rail networks halt all shipments, leaving district warehouses empty."
 ben_dvorak_promises_recovery:0 "Dvořák Promises Recovery"
 ben_dvorak_promises_recovery_desc:0 "Addressing an increasingly anxious public from the municipal steps, Matěj Dvořák pledges that local emergency measures will overcome the trade embargo."
 ben_the_beer_rationing_question:0 "The Beer Rationing Question"
 ben_the_beer_rationing_question_desc:0 "With food and industrial goods scarce, town elders debate whether subsidizing cheap municipal beer is an essential measure to preserve public order and civilian morale."
 ben_stepan_knows_everyone:0 "Štěpán Knows Everyone"
 ben_stepan_knows_everyone_desc:0 "Štěpán Pospíšil possesses an unmatched network across local pubs, railway depots, and storage sheds, quietly coordinating unofficial supply transfers where formal bureaucracy fails."
 ben_the_strategist_of_benesov:0 "The Strategist of Benešov"
 ben_the_strategist_of_benesov_desc:0 "Adam Pospíšil, a dedicated communist organizer, begins addressing worker gatherings, framing Benešov's crisis not as a local misfortune, but as a grand strategic problem demanding systematic revolution."
 ben_a_thousand_hours_of_experience:0 "A Thousand Hours of Experience"
 ben_a_thousand_hours_of_experience_desc:0 "Pospíšil's supporters point to his encyclopedic grasp of operational simulations and strategic exercises as evidence that he possesses the rigorous intellect needed to lead the district."
 ben_workers_in_the_back_rooms:0 "Workers in the Back Rooms"
 ben_workers_in_the_back_rooms_desc:0 "In tavern cellars, quiet back alleys, and darkened workshops, industrial laborers and municipal volunteers organize into cohesive political cells."
 ben_the_benesov_workers_congress:0 "The Benešov Workers' Congress"
 ben_the_benesov_workers_congress_desc:0 "Delegates from across the district assemble to establish a parallel governing council, openly challenging Dvořák's wavering administration."
 ben_dvorak_has_lost_the_streets:0 "Dvořák Has Lost the Streets"
 ben_dvorak_has_lost_the_streets_desc:0 "Mass demonstrations fill the municipal square. The police refuse to disperse the workers, making it plain that Dvořák's legal authority no longer commands the town."
 ben_pospisil_takes_command:0 "Pospíšil Takes Command"
 ben_pospisil_takes_command_desc:0 "Surrounded by cheering workers and armed factory guards, Adam Pospíšil ascends to the municipal executive, ending liberal administration and declaring a revolutionary regime."
 ben_the_peoples_republic_of_benesov:0 "The People's Republic of Benešov"
 ben_the_peoples_republic_of_benesov_desc:0 "The revolutionary government consolidates its authority, hoisting the socialist banner and establishing the People's Republic of Benešov."
 ben_every_citizen_a_strategist:0 "Every Citizen a Strategist"
 ben_every_citizen_a_strategist_desc:0 "State education centers and trade union halls introduce mandatory courses in military history, operational planning, and logistical geometry."
 ben_stepans_distribution_network:0 "Štěpán's Distribution Network"
 ben_stepans_distribution_network_desc:0 "Formalizing the informal, Štěpán Pospíšil centralizes district trucking routes, brewery distribution lines, and industrial warehouses into a unified logistical apparatus."
 ben_the_pospisil_doctrine:0 "The Pospíšil Doctrine"
 ben_the_pospisil_doctrine_desc:0 "Synthesizing grand operational theory with decentralized logistics, the Pospíšil Doctrine outlines how a compact, highly drilled force can decisively outmaneuver conventional opponents."
 ben_we_have_read_the_meta:0 "We Have Read the Meta"
 ben_we_have_read_the_meta_desc:0 "Benešov's high command boasts that by studying every operational contingency and optimizing combat formations, our forces understand modern warfare far better than decadent great powers."
 ben_benesov_will_not_remain_small:0 "Benešov Will Not Remain Small"
 ben_benesov_will_not_remain_small_desc:0 "Having forged a resilient economic and military machine while the old order decayed, Benešov refuses to be confined to a single district."
 ben_the_failure_of_the_old_republic:0 "The Failure of the Old Republic"
 ben_the_failure_of_the_old_republic_desc:0 "The bourgeois Czechoslovak state abandoned its frontier regions and left workers to starve. Its claim to represent the Czech nation is officially declared null and void."
 ben_a_government_worthy_of_bohemia:0 "A Government Worthy of Bohemia"
 ben_a_government_worthy_of_bohemia_desc:0 "The People's Republic declares itself the legitimate vanguard of the Czech working class, presenting Benešov as the true heart of Bohemian rebirth."
 ben_liberate_the_czech_workers:0 "Liberate the Czech Workers"
 ben_liberate_the_czech_workers_desc:0 "From Prague to the border mountains, the working people await deliverance. Benešov prepares its operational forces to spearhead the reunification of the Czech lands under socialism."
