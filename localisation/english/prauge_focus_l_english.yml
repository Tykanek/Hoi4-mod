l_english:

 # ==============================================================
 pra_czech_supervisors_return: "Czech Supervisors Return"
 pra_czech_supervisors_return_desc: "Prague will accept deeper oversight from the Czechoslovak government. Municipal decisions remain local in form, but the republic's supervisors will now have the final word."
 pra_integrate_municipal_administration: "Integrate the Municipal Administration"
 pra_integrate_municipal_administration_desc: "Prague's ministries, police and administration will be folded into Czechoslovak structures. The city will retain its name, but not its separate machinery of state."
 pra_return_prague_to_republic: "Return Prague to the Republic"
 pra_return_prague_to_republic_desc: "The last institutions of the Prague arrangement will be surrendered to Czechoslovakia. Reunification will end Prague's separate existence."
 pra_return_prague_to_republic_tt: "Completing this focus will reintegrate Prague into Czechoslovakia. CZE will annex PRA."

 pra_directorate_needs_experts: "The Directorate Needs Experts"
 pra_directorate_needs_experts_desc: "A city-state aspiring to lead the Czech nation cannot rely indefinitely on improvised municipal engineers. The Directorate will recruit researchers, statisticians and technical specialists for the state."

 # SOVEREIGNTY
 # ==============================================================
 prague_declare_independence: "Proclaim Prague's Sovereignty"
 prague_declare_independence_desc: "The agreements binding Prague to the Czech administration have become intolerable. The capital will determine its own future, whatever price the countryside makes it pay."
 prague_remain_czech_subject: "Preserve the Czech Arrangement"
 prague_remain_czech_subject_desc: "Independence would leave Prague isolated from the countryside on which it depends. We may dislike subordination, but survival requires an honest accounting of what the city cannot grow for itself."

 # ==============================================================
 # STRAŠNICE ORGANIZES
 # ==============================================================
 pra_mobilize_vltava_defense_front: "Peter Mohammedis Enters the Game"
 pra_mobilize_vltava_defense_front_desc: "Prague has declared sovereignty, but sovereignty is easier to proclaim than to govern. Peter Mohammedis, still only a colonel with a reputation in Strasnice, begins speaking in public and gathering veterans, workers and curious citizens around the first real base of his movement. Most officials see a local personality making noise; Mohammedis is content to let them underestimate him."
 pra_vltava_defense_front_tt: "The §YStrasnice movement§! will organize bridge and railway guards and raise its first armed formation in Prague."

 pra_bread_under_black_banner: "Peter Feeds Prague"
 pra_bread_under_black_banner_desc: "Shortages are biting and the provisional government has little to show beyond committees and promises. Mohammedis's Strasnice organization starts moving food, ration cards and supplies through the city, while his name and portrait appear wherever a queue is finally shortened. He discovers that a practical miracle wins more loyalty than a month of parliamentary speeches."
 pra_bread_under_black_banner_tt: "The §YStrasnice movement§! will establish its ration network and unlock §YStrasnice Supply Operations§!."
 pra_win_over_municipal_police: "Friends in the Right Places"
 pra_win_over_municipal_police_desc: "Junior police officers, municipal officials and clerks inside Prague's administration begin quietly answering to Mohammedis before they answer to the government. Orders are delayed, softened or lost in the machinery of the city, and no one can quite identify who gave the instruction. The Colonel realizes that taking power is much easier when the people expected to stop you are already on your side."
 pra_municipal_police_support_tt: "The §YPrague Municipal Police§! will refuse to defend the provisional government if Mohammedis moves against it."
 pra_legionaries_answer_call: "The Men Behind Mohammedis"
 pra_legionaries_answer_call_desc: "Old Legion veterans open their association halls, officers offer their staffs and organized supporters emerge from Strasnice in disciplined ranks. What began as a neighborhood movement now has the men, uniforms and command structure to challenge the government openly. Cabinet ministers are finally forced to understand that the coup is no longer a possibility. It is coming."
 pra_legionaries_answer_call_tt: "Experienced legionary veterans will form the §Y1. Legionarsky pluk§! and lend their authority to Mohammedis's movement."
 pra_strange_interlude:0 "Blame Beneshov for Everything"
 pra_strange_interlude_desc:0 "After an exhaustive inter-ministerial inquiry, the Prague government has reached a historic and unavoidable conclusion: the administration in Beneshov is responsible for virtually every problem currently facing Prague and, upon closer examination, the wider world. Official findings attribute to Beneshov not only railway delays, industrial problems, and administrative failures, but also poor harvests, bad weather, climate change, economic instability, ongoing wars in Asia, and several unspecified international crises. By naming the culprit with total bureaucratic certainty, the authorities have given the public a clear and comforting explanation for all present hardships."
 PRA_blames_benesov:0 "Blamed for Everything"
 pra_investigate_benesov_hatred:0 "Investigate Our Hatred of Beneshov"
 pra_investigate_benesov_hatred_desc:0 "Now that Beneshov has been formally identified as the origin of an extraordinary range of domestic and international difficulties, the Directorate has concluded that Prague's hostility toward its southern neighbour deserves a rigorous, scientific foundation. Standing subcommittees, statistical bureaus, and inter-ministerial commissions of inquiry will be convened to catalog every grievance, trace every suspicious coincidence, and determine with total bureaucratic precision just how many additional reasons Prague has to distrust Beneshov."
 pra_incompetence_of_pospisil:0 "Incompetence of Pospisil"
 pra_incompetence_of_pospisil_desc:0 "Prague's investigators have concluded that the dysfunction of Beneshov can be traced directly to Pospisil's leadership. Administrative failures, confused orders, and increasingly questionable decisions are presented as evidence that the government of Beneshov is simply incapable of governing itself."
 pra_get_them_all_drunk:0 "Get Them All Drunk"
 pra_get_them_all_drunk_desc:0 "The Directorate concludes that Beneshov's administrative decline can be accelerated by ensuring that as many officials, workers, and soldiers as possible remain permanently intoxicated. A calculated sabotage programme will deliver spirits directly to their doorstep."
 pra_pospisil_cant_play_hoi4:0 "Pospisil Can't Play HOI4"
 pra_pospisil_cant_play_hoi4_desc:0 "Prague intelligence has obtained disturbing evidence that Pospisil is incapable of managing even a grand-strategy simulation. The Directorate argues that someone unable to coordinate fronts, production, and logistics in Hearts of Iron IV cannot reasonably be trusted with a real country."
 pra_u_r_trash_kid:0 "U R Trash Kid"
 pra_u_r_trash_kid_desc:0 "With open war underway, Prague abandons subtle psychological warfare and begins broadcasting increasingly direct insults toward Beneshov's soldiers and government. Despite the childish wording, the campaign is treated by the Directorate as legitimate military psychological warfare."
 pra_holy_trash_templates:0 "Holy Trash Templates"
 pra_holy_trash_templates_desc:0 "Prague intelligence has reviewed Beneshov's army organization and concluded that its division templates are catastrophically bad. The analysis is considered so damaging that Beneshov's military establishment loses confidence in its own doctrine and planning."
 PRA_benesov_economic_sabotage:0 "Suspected Economic Sabotage"
 PRA_benesov_railway_delays:0 "Blamed for Railway Delays"
 PRA_benesov_weather_connection:0 "Suspected Weather Manipulation"
 PRA_benesov_foreign_wars:0 "Blamed for Foreign Wars"
 PRA_benesov_dossier:0 "The Beneshov Dossier"

 # ==============================================================
 # THE COUP
 # ==============================================================
 pra_mohammedis_overthrows_government: "Peter Mohammedis Takes the Throne"
 pra_mohammedis_overthrows_government_desc: "The government spends weeks debating whether Mohammedis is dangerous, inconvenient, or merely the loudest colonel in Prague. By the time the cabinet reaches a conclusion, sympathetic police refuse to intervene, veterans hold the key buildings, Strasnice supporters occupy government offices, and the men sent to arrest him are taking orders from him. The ministers are arrested, the Directorate is proclaimed, and the takeover is completed with the unsettling efficiency of a well-run municipal works programme. Peter Mohammedis now rules Prague."

 # ==============================================================
 # FORTRESS PRAGUE
 # ==============================================================
 pra_fortify_vltava_crossings: "Fortify the Vltava Crossings"
 pra_fortify_vltava_crossings_desc: "Prague's bridges are lifelines and vulnerabilities. Concrete strongpoints, barricades and anti-aircraft positions will ensure that any enemy crossing the Vltava pays for every metre."
 pra_fortify_vltava_crossings_tt: "The approaches to Prague will receive §YLand Forts§! and §YAnti-Air Defences§!."
 pra_commandeer_workshops: "Commandeer the Workshops"
 pra_commandeer_workshops_desc: "CKD, railway sheds and the workshops of Vysocany cannot be left to civilian contracts while the city is encircled. Their machines will now serve the defence of Prague."
 pra_commandeer_workshops_tt: "Prague workshops will be reorganized for §Ymilitary production§!."
 pra_every_district_barracks: "Every District a Barracks"
 pra_every_district_barracks_desc: "Karlin, Zizkov, Holesovice and every other district must maintain its own reserve. The city has little strategic depth, so every neighbourhood must become part of its army."
 pra_every_district_barracks_tt: "Two additional §YPrague militia formations§! will be raised and local manpower mobilized."

 # ==============================================================
 # BENEŠOV
 # ==============================================================
 pra_crush_benesov_threat: "Crush the Beneshov Threat"
 pra_crush_benesov_threat_desc: "Beneshov controls the agricultural hinterland and the coal routes outside Prague. The Directorate can ration and fortify, but it cannot make the countryside appear. The city's survival now requires breaking the encirclement."

 praguean_focus: "Praguean Focus"
 praguean_focus_desc: "National focus tree for the City-State of Prague."

 # ==============================================================
 # ARMY
 # ==============================================================
 pra_reorganize_prague_garrison: "The City Is the Fortress"
 pra_reorganize_prague_garrison_desc: "Prague cannot trade territory for time. Its garrison must be reorganized around streets, courtyards and prepared urban positions."
 pra_standardize_army_equipment: "Guns Behind Every Barricade"
 pra_standardize_army_equipment_desc: "Uniform rifles, ammunition and maintenance schedules make a small city's army easier to supply and harder to dislodge. In Prague's cramped depots, standardization will matter as much as courage when every crate must reach the right barricade."
 pra_artillery_for_the_capital: "Artillery for the Capital"
 pra_artillery_for_the_capital_desc: "Prepared batteries around Prague's approaches will make limited manpower count through firepower. Artillery observers will tie the guns to bridges, rail junctions and the roads by which an enemy might try to close the capital's ring."
 pra_motorized_reserves: "The Thirty-Minute Reserve"
 pra_motorized_reserves_desc: "Municipal lorries and delivery fleets will carry reserve columns across Prague before a threatened district is isolated. The city's transport network will become a military instrument, moving men faster than an attacker can turn a local breach into an encirclement."
 pra_prague_general_staff: "The Prague War School"
 pra_prague_general_staff_desc: "A city that cannot retreat needs officers who can coordinate every barricade, battery and reserve column. The Prague General Staff will replace improvised orders with a common map, a common timetable and a clear answer to every emergency."

 # ==============================================================
 # AIR FORCE
 # ==============================================================
 pra_establish_air_command: "Eyes Above the Vltava"
 pra_establish_air_command_desc: "Rooftop observers and an independent air command will give Prague its first warning net against raids. The capital's defenders must hear the engines over the Vltava before bombs begin falling on its stations and workshops."
 pra_expand_letnany_aviation_complex: "Sirens Over Prague"
 pra_expand_letnany_aviation_complex_desc: "Letnany and Kbely will receive the runways, hangars and reporting links needed for rapid scrambles. Together they will give Prague a compact aviation complex able to disperse aircraft, repair damage and keep watch over the approaches."
 pra_avia_fighter_programme: "Avia's Finest"
 pra_avia_fighter_programme_desc: "Avia engineers and pilots will specialize in steep climbs and close-range bomber interception. Prague cannot match larger air forces aircraft for aircraft, but it can make the sky above the capital an expensive place to cross."
 pra_letov_ground_support_programme: "Letov Flies Low"
 pra_letov_ground_support_programme_desc: "Letov aircraft will coordinate low-level attacks with the infantry defending Prague's approaches. Their pilots will work from the same reports as the bridge guards and artillery, bringing a city's air arm close enough to support the men below."
 pra_air_defence_of_prague: "Not One Bomb on Prague"
 pra_air_defence_of_prague_desc: "Observers, fighters and anti-aircraft crews will answer to one integrated command. Prague's warning sirens, Kbely interceptors and rooftop guns will become parts of one shield rather than isolated local precautions."

 # ==============================================================
 # INDUSTRY
 # ==============================================================
 pra_mobilize_prague_industry: "Who Needs a Hinterland?"
 pra_mobilize_prague_industry_desc: "Most countries have mines, fields and sprawling industrial regions behind their capitals. Prague has tram depots, repair halls and a Directorate convinced that determination is a raw material. The first task is to count every machine the city owns before someone requisitions it twice."
 pra_modernize_workshops: "If It Has a Lathe, It Is a Factory"
 pra_modernize_workshops_desc: "Small workshops have spent years making do with worn tools, irregular orders and whatever the next street could provide. Standardized equipment and schedules will turn them into one war economy, at least on paper. In Prague, that is often the stage at which the paperwork becomes reality."
 pra_expand_ckd_works: "CKD Does Not Sleep"
 pra_expand_ckd_works_desc: "The lights at CKD will remain burning long after the rest of Vysocany has gone quiet. Engines, welding gear and half-finished machines will move through the works under the supervision of workers who are no longer certain whether they are building for the army or simply refusing to stop. The Directorate considers the distinction unimportant."
 pra_municipal_works_programme: "The Trams Have Been Requisitioned"
 pra_municipal_works_programme_desc: "Municipal transport, repair crews and public works departments will be folded into the emergency economy. Tram workshops will keep vehicles moving, carry workers and salvage anything that looks remotely useful. No one claims every tram will become a tank, but nobody is allowed to ask what the spare parts are for."
 pra_arsenal_of_prague: "Prague Will Build It Somehow"
 pra_arsenal_of_prague_desc: "The first industrial programme has produced a city-wide collection of tools, contracts, requisitions and improbable solutions. The Directorate will call it an arsenal, and the name will become true through repetition. Prague still lacks a hinterland; it has, however, acquired enough stubborn engineers to compensate."

 # EXPANDED ARMY
 pra_thirty_minute_reserve: "The Thirty-Minute Reserve"
 pra_thirty_minute_reserve_desc: "Prague cannot afford to discover a weak district only after it has been cut off. Municipal lorries, tram crews and reservists will be organized into a reserve able to cross the city before an attacker can close the bridges."
 pra_barricade_doctrine: "The Doctrine of the Barricades"
 pra_barricade_doctrine_desc: "The barricade is more than an improvised obstacle; it is the first position of a city that has no ground to surrender. Officers will combine street fighting, prepared fire lanes and local knowledge into a doctrine suited to Prague's narrow districts."
 pra_every_bridge_a_fortress: "Every Bridge a Fortress"
 pra_every_bridge_a_fortress_desc: "The Vltava divides Prague, but it must never divide its defenders. Each crossing will receive prepared demolitions, firing positions and engineers ready to turn the river into a barrier against encirclement."
 pra_legionary_officer_school: "The Legionary Officer School"
 pra_legionary_officer_school_desc: "The veterans who survived Siberia and the long return home understand movement, exhaustion and the cost of hesitation. Their experience will be formalized in a Prague school for officers who can command both disciplined units and desperate street defenders."
 pra_metropolitan_assault_groups: "Metropolitan Assault Groups"
 pra_metropolitan_assault_groups_desc: "A defensive city still needs men who can seize a crossroads, clear a factory and reopen a railway line. Carefully selected troops will form mobile assault groups built around Prague's limited manpower and dense urban terrain."
 # EXPANDED AIR FORCE
 pra_prague_air_warning_service: "The Prague Air Warning Service"
 pra_prague_air_warning_service_desc: "A small air force cannot defend the capital if it is surprised on the ground. Observers on church towers, factory roofs and the hills around Prague will build an early-warning net tied to the city's command posts."
 pra_kbely_command_network: "The Kbely Command Network"
 pra_kbely_command_network_desc: "Kbely will become the nerve centre of Prague's compact air arm. Telephone links, reporting stations and reserve crews will connect the airfield to Letnany, the anti-aircraft batteries and the Directorate's warning room."
 pra_underground_aircraft_workshops: "Underground Aircraft Workshops"
 pra_underground_aircraft_workshops_desc: "Bombing a runway must not mean grounding Prague's defenders. Dispersed workshops and concealed repair halls will keep Avia and Letov machines serviceable even when the capital's visible hangars are under attack."
 pra_interceptor_priority: "Interceptor Priority"
 pra_interceptor_priority_desc: "Prague has neither the fuel nor the industry to maintain every kind of aircraft in equal numbers. Fighters able to climb quickly over the Vltava will receive the engines, pilots and scarce materials needed to stop bombers before they reach the centre, at the expense of close-support emphasis."
 pra_army_cooperation_air: "Air-Ground Cooperation"
 pra_army_cooperation_air_desc: "The city's aircraft must do more than circle above its rooftops. Pilots and infantry officers will rehearse signals for close support, giving Prague a way to break attacks at bridges and road junctions, while accepting weaker pure interception over the capital."

 # EXPANDED INDUSTRY
 pra_vysocany_subcontractors: "The Workshop Next Door"
 pra_vysocany_subcontractors_desc: "Vysocany is full of small workshops that know how to repair one machine, improvise another and complain about both. The Directorate will bind them into a subcontracting network so a shortage in one shop becomes an assignment for the next. Production will continue, provided nobody asks how many ledgers are being kept."
 pra_night_shifts_at_ckd: "The Lights Stay On at CKD"
 pra_night_shifts_at_ckd_desc: "CKD's presses and lathes will work through the night, the next night and whatever follows it. Protected deliveries and ration priority will keep the works supplied while exhausted engineers discover that sleep is now a strategic luxury. The machines are not permitted to notice."
 pra_nothing_leaves_scrap_yard: "Check the Scrap Yard Again"
 pra_nothing_leaves_scrap_yard_desc: "The Directorate is convinced that somewhere beneath the rust, broken wheels and abandoned boilers there is still something useful. Warehouses, sidings and scrapyards will be searched again, then searched by someone who was not present the first time. In Prague, salvage is a form of state optimism."
 pra_municipal_transport_authority: "The Trams Belong to the State"
 pra_municipal_transport_authority_desc: "Trams, garages and delivery routes are military assets whether their operators agree or not. A single authority will move workers, ammunition and reserves across the city, while pretending that the civilian timetable remains intact. The Directorate has decided that public transport is public property in the most literal sense."
 pra_skoda_connections: "Ask Skoda Nicely"
 pra_skoda_connections_desc: "Prague cannot manufacture every engine, gun and component from the contents of its own basements. Contacts with Skoda will provide designs, parts and the occasional answer from an engineer who has already solved the problem elsewhere. The Directorate will call this cooperation; the workshops will call it borrowing."
 pra_underground_production_halls: "If They Can Bomb It, Bury It"
 pra_underground_production_halls_desc: "The logic is simple enough for a Directorate decree: if enemy aircraft can reach a factory, the factory is in the wrong place. Cellars, tunnels and concealed halls will take over the most important work beneath streets that still appear civilian. Prague's production lines will continue below the bombing."
 pra_prague_technical_institute: "Someone Find an Engineer"
 pra_prague_technical_institute_desc: "Every improvised repair eventually reaches the point where someone asks why it was designed that way. Students, professors and workshop foremen will be placed at the disposal of the war economy, where they will be expected to produce answers before the next machine breaks. The Directorate has requisitioned the institute's patience along with its laboratories."
 # MOHAMMEDIS
 pra_morning_after_coup: "The Morning After the Coup"
 pra_morning_after_coup_desc: "The flags have changed, but the ministries, ration offices and police stations still carry the habits of the old republic. Mohammedis has taken Prague in an afternoon; now he must persuade its clerks, workers and hungry families that the new order can last until morning. A coup is a moment. A Directorate is paperwork with armed guards."
 pra_dissolve_old_parties: "Dissolve the Old Parties"
 pra_dissolve_old_parties_desc: "The old parties still have offices, newspapers and the dangerous habit of assuming tomorrow will resemble yesterday. Mohammedis closes them, insisting that Prague has no room for factions competing with the man who saved it from them. The Directorate will tolerate many opinions, provided they are expressed after the decree."
 pra_directorate_decrees: "The Directorate Decrees"
 pra_directorate_decrees_desc: "Every ministry receives a new order, a new reporting chain and a reminder that the Colonel's signature is now a source of law. The decrees are short because Mohammedis dislikes explanations and long because the clerks must copy them everywhere. By evening, even the smallest municipal office knows which way Prague's authority flows."
 pra_purge_municipal_bureaucracy: "Purge the Municipal Bureaucracy"
 pra_purge_municipal_bureaucracy_desc: "The old administration contains loyal professionals, cautious doubters and a surprising number of people who believe forms should be processed in order. Hostile clerks will be removed, uncertain ones watched and obedient ones promoted into jobs they were not expecting. Mohammedis accepts a less capable bureaucracy in exchange for one that understands who is in charge."
 pra_reward_loyal_officers: "Reward the Loyal Officers"
 pra_reward_loyal_officers_desc: "The officers who stood with Mohammedis will receive commands, influence and a direct line to the Directorate. Their loyalty will become the foundation of a new military establishment, while those who waited to see who would win discover that hesitation has its own rank. Prague's officer corps is learning that the safest salute is the quickest one."
 pra_black_uniform: "The Black Uniform"
 pra_black_uniform_desc: "A common uniform will turn Strasnice's neighborhood units into the regime's public army. In the streets of Prague, the black coat will announce that the volunteers who saved the capital now belong to the state Mohammedis is building. It will also make it considerably easier for the Directorate to identify anyone claiming not to have joined."
 pra_bread_before_politics: "Bread Before Politics"
 pra_bread_before_politics_desc: "The Directorate will improve its rationing system where it can, buying acceptance with food while keeping distribution under political control. Mohammedis understands that discipline cannot be sustained by speeches alone when families are waiting outside the ration offices. Even a personal regime must occasionally deliver the bread it promised."
 pra_city_of_discipline: "The City of Discipline"
 pra_city_of_discipline_desc: "Mohammedis has secured the ministries, the streets and the ration queues, but survival still depends on millions of small acts of obedience. Prague will be remade as a disciplined garrison city in which every district knows its duty and every institution serves the emergency state. The Colonel has not yet made every citizen enthusiastic, but he has made enthusiasm administratively unnecessary."
 pra_mohammedis_speaks_from_rudolfinum: "Mohammedis Speaks from the Rudolfinum"
 pra_mohammedis_speaks_from_rudolfinum_desc: "From the Rudolfinum, Mohammedis will make the coup's temporary language permanent. Prague will not return to hesitation while the Czech lands remain divided, and the Directorate will no longer pretend that its authority is provisional. The Colonel speaks as if the city had been waiting for him all along, which is easier now that the microphones belong to him."
 pra_colonel_becomes_the_state: "The Colonel Becomes the State"
 pra_colonel_becomes_the_state_desc: "The Directorate, the army and the food office now answer to one man. Mohammedis has ceased to be merely the officer who seized Prague; every decree, ration and parade now carries some part of his authority. The state has not officially become Peter Mohammedis, but it is becoming increasingly difficult to explain the difference."

 # CZECH EXPANSION
 pra_prague_is_not_an_island: "Prague Is Not an Island"
 pra_prague_is_not_an_island_desc: "Beneshov's defeat opens the question the coup postponed: can a capital remain sovereign while the rest of the Czech lands answer elsewhere? The Vltava may shelter Prague, but food, railways and strategic depth lie beyond the city limits."
 pra_protector_of_bohemia: "Protector of the Prague Hinterland"
 pra_protector_of_bohemia_desc: "Prague cannot call itself safe while the first district beyond its limits remains outside its command. The Directorate will demand control of one outer district as an administrative shield for the capital, carefully avoiding the word conquest."
 pra_borders_of_1918: "The Borders of 1918"
 pra_borders_of_1918_desc: "Prague will invoke the memory of the first republic and demand one further district along the old Czech administrative border. The language of 1918 will give Mohammedis a legal and historical cloak for an ambition the old parliament would never have accepted."
 pra_demand_central_bohemian_belt: "Demand the Central Bohemian Belt"
 pra_demand_central_bohemian_belt_desc: "The first concessions have made the next demand easier to draft. Prague will demand control of one Central Bohemian district and call it a security necessity, because that sounds less alarming than another territorial seizure."
 pra_ultimatum_from_prague: "The Ultimatum from Prague"
 pra_ultimatum_from_prague_desc: "A formal demand will give Czechoslovakia one last chance to surrender one remaining district on Prague's southern approach before the army makes the argument. Mohammedis will call it a final offer of Czech unity; the staff officers preparing it call it an ultimatum."
 pra_secure_elbe_approaches: "Secure the Elbe Approaches"
 pra_secure_elbe_approaches_desc: "The eastern approach now under Prague's authority must be defended as carefully as the bridges inside the capital. Control of the Elbe approaches will protect the new security belt and give the Directorate room to move, supply and survive."
 pra_one_czech_command: "One Czech Command"
 pra_one_czech_command_desc: "Legionaries, municipal officers and the surviving Czech high command will be folded into a single national staff. Prague's improvised chain of command must become a Czech one if the Directorate intends to hold the districts it has acquired without admitting how they were acquired."
 pra_czech_state_reborn: "The Czech State Reborn"
 pra_czech_state_reborn_desc: "The emergency that began in Prague has outgrown the city that gave it birth. With Prague's acquired districts secured and their administration unified, Mohammedis will proclaim a Czech state rebuilt around survival, military unity and the authority of Prague-without pretending that the rest of the country has agreed."
 pra_secure_western_bohemia: "Secure Western Bohemia"
 pra_secure_western_bohemia_desc: "West of the capital lie the industrial furnaces of Plzen and the western rail corridors that once sustained the republic. The Directorate cannot leave such vital war material and manufacturing potential in hesitant hands. We will demand the immediate cession of the western districts."
 pra_bring_south_into_fold: "Bring the South into the Fold"
 pra_bring_south_into_fold_desc: "The southern road towards Tabor and the historic redoubts of southern Bohemia must be aligned under Prague's direct authority. From the Hussite strongholds to the administrative seat at Budweis, the southern lands must be integrated to anchor the capital's southern flank."
 pra_secure_eastern_bohemia: "Secure Eastern Bohemia"
 pra_secure_eastern_bohemia_desc: "Along the upper reaches of the Elbe and the rolling districts of eastern Bohemia, the remaining interior territory stands vulnerable. By demanding the eastern districts, the Directorate secures the entire Bohemian heartland up to the traditional Moravian threshold."
 pra_bohemian_borderlands: "The Bohemian Borderlands"
 pra_bohemian_borderlands_desc: "The mountains that ring northern and western Bohemia are studded with the extensive concrete fortifications and border redoubts of the republic. Prague will demand that the garrisoning and administration of these frontier districts pass to Directorate troops before external powers decide their fate."
 pra_secure_southern_borderlands: "Secure the Southern Borderlands"
 pra_secure_southern_borderlands_desc: "Along the forested ridge of the Sumava, the southern mountain border guards the approach from Austria and Bavaria. Prague must extend its defensive shield over this rugged rim to complete the natural fortress of Bohemia."
 pra_demand_territory_tt: "A formal diplomatic demand will be presented to Czechoslovakia after a short deliberation."
 pra_territory_already_resolved_tt: "Prague already controls or has resolved all territorial claims in this region."
 PRA_demand_1088_tt: "Send a diplomatic demand to Czechoslovakia requesting the transfer of Kladno."
 PRA_demand_1089_tt: "Send a diplomatic demand to Czechoslovakia requesting the transfer of Beroun."
 PRA_demand_1090_tt: "Send a diplomatic demand to Czechoslovakia requesting the transfer of Pribram."
 PRA_demand_1087_tt: "Send a diplomatic demand to Czechoslovakia requesting the transfer of Melnik."
 PRA_demand_western_bohemia_tt: "Send a diplomatic demand to Czechoslovakia requesting the transfer of Western Bohemia (Plzen and Rokycany)."
 PRA_demand_southern_bohemia_tt: "Send a diplomatic demand to Czechoslovakia requesting the transfer of Southern Bohemia (Ceske Budejovice and Tabor)."
 PRA_demand_eastern_bohemia_tt: "Send a diplomatic demand to Czechoslovakia requesting the transfer of Eastern Bohemia (Hradec Kralove, Pardubice, Jicin, and Nachod)."
 PRA_demand_bohemian_borderlands_tt: "Send a diplomatic demand to Czechoslovakia requesting the transfer of Northern and Western Bohemian borderlands (Usti nad Labem, Liberec, Cheb, Karlovy Vary, and Most)."
 PRA_demand_southern_borderlands_tt: "Send a diplomatic demand to Czechoslovakia requesting the transfer of Southern Bohemian borderlands (South Sudetenland)."
