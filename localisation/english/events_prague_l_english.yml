l_english:

 pra_mohammedis.1.t: "Prague Stands Alone"
 pra_mohammedis.1.d: "The consequences of sovereignty arrive faster than even the pessimists expected. Freight traffic from the south collapses, coal deliveries are interrupted and Beneshov authorities refuse passage to Prague-bound convoys.\n\nThe provisional Senate insists that diplomacy will restore normal trade. Across the city, however, queues outside food depots grow longer by the day."
 pra_mohammedis.1.a: "We knew independence would have a price."

 pra_mohammedis.2.t: "The Police Will Not Intervene"
 pra_mohammedis.2.d: "Mohammedis has spent weeks meeting quietly with junior police commanders, many of them veterans themselves. No formal conspiracy has been created and no written pledge exists.\n\nNone is necessary.\n\nShould the Senate order the Municipal Police to suppress the Strasnice movement, its orders will be delayed, misunderstood or simply ignored."
 pra_mohammedis.2.a: "That will be enough."

 pra_mohammedis.3.t: "The Government Has Fallen"
 pra_mohammedis.3.d: "Before dawn, columns of armed members of the Strasnice movement move through the streets toward the Rudolfinum. Municipal police watch from intersections but make no attempt to stop them.\n\nWithin hours, nearly three thousand men surround the seat of the provisional government. The parliamentary guard, isolated and hopelessly outnumbered, surrenders its weapons without firing a shot.\n\nPeter Mohammedis enters the assembly chamber personally. He accuses the cabinet of preparing Prague's capitulation, orders the ministers arrested and declares the provisional Senate dissolved. In its place he proclaims a Directorate of National Salvation. Parliamentary government in Prague is over."
 pra_mohammedis.3.a: "The Directorate will save Prague."

 pra_mohammedis.4.t: "The Encirclement Must Be Broken"
 pra_mohammedis.4.d: "Prague has endured shortages, political paralysis and the collapse of its provisional government. The Directorate has fortified the capital, armed its districts and redirected the city's industry toward war.\n\nMohammedis now argues that none of these measures can guarantee Prague's survival while Beneshov retains control of the surrounding routes. The city has prepared long enough."
 pra_mohammedis.4.a: "Forward."

 pra_mohammedis.5.t: "Rumours of Capitulation"
 pra_mohammedis.5.d: "The legionaries bring more than rifles. They bring stories from Siberia, from the border garrisons and from every crisis in which parliamentary committees asked soldiers to wait. Now rumours spread that the Senate will accept Beneshov's terms to reopen the roads.\n\nMohammedis says the city cannot survive another week of indecision. His veterans answer that the order to act must come before the order to surrender."
 pra_mohammedis.5.a: "Prague will not be bargained away."

 pra_mohammedis.6.t: "The Hinterland Routes Reopened"
 pra_mohammedis.6.d: "Beneshov has capitulated. Prague's military victory does not erase the months of rationing, but the roads and coal routes beyond the city are no longer held by the force that strangled them. The emergency shortage regime can finally be dismantled."
 pra_mohammedis.6.a: "The city can breathe again."

 pra_mohammedis.7.t: "The Morning After"
 pra_mohammedis.7.d: "Prague wakes beneath new flags. The Directorate has occupied the ministries, sealed the Senate archives and placed every district under emergency command. Some citizens cheer the end of parliamentary hesitation; others watch the black-uniformed patrols and wonder whether the emergency will ever end."
 pra_mohammedis.7.a: "Order first. Questions later."

 pra_mohammedis.8.t: "The Bureaucrats Resist"
 pra_mohammedis.8.d: "Several senior clerks have refused to sign the Directorate's decrees. They are not soldiers and have no following in the streets, but they know where the records, ration ledgers and municipal keys are kept. Mohammedis must decide whether to compromise with the old administration or remove it wholesale."
 pra_mohammedis.8.a: "Replace every doubtful hand."

 pra_mohammedis.9.t: "The Black Uniform"
 pra_mohammedis.9.d: "The Strasnice movement's volunteers now receive a common uniform and a common oath. The sight is deliberate: Prague's districts are no longer a collection of local guards, but the visible instrument of the Directorate."
 pra_mohammedis.9.a: "Let the city see its new authority."

 pra_mohammedis.10.t: "A City of Discipline"
 pra_mohammedis.10.d: "The Directorate's decrees have reached every tram depot, school, warehouse and police station. Curfews are enforced, trains depart on schedule and the queues move under armed supervision. Prague is functioning again, though the city has paid for efficiency with its remaining political freedom."
 pra_mohammedis.10.a: "Discipline is survival."

 pra_mohammedis.11.t: "Mohammedis Speaks from the Rudolfinum"
 pra_mohammedis.11.d: "Standing where he dissolved the provisional Senate, Peter Mohammedis promises that Prague will no longer beg for access to its own roads. He calls the Directorate temporary only in the sense that war is temporary: both will last until victory makes the old question irrelevant."
 pra_mohammedis.11.a: "Prague will lead."

 pra_mohammedis.12.t: "Prague Is Not an Island"
 pra_mohammedis.12.d: "Beneshov has fallen, but the victory leaves the central Czech lands divided between a restored Czechoslovakia and a Prague that has learned to govern itself. The Directorate now debates whether independence was a refuge or the first step toward a larger Czech state."
 pra_mohammedis.12.a: "The Vltava must reach beyond the city."

 pra_mohammedis.13.t: "The Ultimatum from Prague"
 pra_mohammedis.13.d: "Prague's diplomatic note demands that Czechoslovakia recognize the capital's claims to the central Bohemian approaches. The language is formal, but no one mistakes the meaning: the Directorate has prepared an army and expects an answer before the next parade."
 pra_mohammedis.13.a: "There will be no more divided commands."

 pra_mohammedis.14.t: "Taborn"
 pra_mohammedis.14.d: "Taborder has disappeared. State offices, arsenals and army commands are being folded into a single administration, while Prague's banners appear beside the older Czech emblems. Mohammedis has won the reunification he promised, but the question of what follows the emergency remains unanswered."
 pra_mohammedis.14.a: "One country, one command."

 pra_mohammedis.18.t: "Prague Demands the First District"
 pra_mohammedis.18.d: "Peter Mohammedis presents the first demand as a temporary administrative measure. Prague, he argues, cannot protect its roads, depots and food routes while the district immediately around the capital answers to another government. The Czechoslovak cabinet considers the request outrageous, but not yet worth a war."
 pra_mohammedis.18.a: "Concede the district."
 pra_mohammedis.18.b: "Prague has gone too far."

 pra_mohammedis.19.t: "Prague Demands the Next District"
 pra_mohammedis.19.d: "Taborder, describing its roads and rail junctions as details that merely happen to require a new owner."
 pra_mohammedis.19.a: "We cannot risk a war over this district."
 pra_mohammedis.19.b: "Reject the demand."

 pra_mohammedis.20.t: "Prague Demands the Central Bohemian District"
 pra_mohammedis.20.d: "The Directorate now demands one central district as a permanent security belt. Rail junctions and supply roads are described as administrative details that merely happen to require a new owner. Czechoslovakia is invited to call this negotiation; the officers reading the note know better."
 pra_mohammedis.20.a: "Concede the district."
 pra_mohammedis.20.b: "Reject the demand."

 pra_mohammedis.21.t: "The Ultimatum from Prague"
 pra_mohammedis.21.d: "Prague's final demand is delivered with troop movements attached. Mohammedis insists that the remaining southern approach must be placed under the Directorate before the capital can be considered secure. Czechoslovakia is invited to call this negotiation; the officers reading the note recognize an ultimatum."
 pra_mohammedis.21.a: "Accept Prague's demands."
 pra_mohammedis.21.b: "Reject the ultimatum."

 pra_cze_accepted_prague_ultimatum: "Czechoslovakia Accepted Prague's Demands"
 pra_cze_rejected_prague_ultimatum: "Czechoslovakia Rejected Prague's Demands"
 pra_cze_conceded_prague_demand: "Czechoslovakia Conceded a Prague Demand"
 pra_cze_rejected_prague_demand: "Czechoslovakia Rejected a Prague Demand"

 pra_bartak_news.1.t: "Prague Considers Command for Vladimir Bartak"
 pra_bartak_news.1.d: "Vladimir Bartak has gained renown across Prague for his exceptional weapons proficiency and combat record. With his military reputation soaring, the Directorate is weighing whether to grant him direct field command."
 pra_bartak_news.1.a: "His battlefield record speaks for itself."

 pra_bartak.1.t: "The Generalship of Vladimir Bartak"
 pra_bartak.1.d: "Bartak's military reputation is unquestioned, but placing him in direct command would move one of the Directorate's most valuable figures into frontline military service. Peter Mohammedis and the command staff must now decide whether to entrust him with an army."
 pra_bartak.1.a: "Promote him to General."
 pra_bartak.1.b: "No, we have better generals."

 pra_bartak_news.2.t: "Vladimir Bartak Promoted to General"
 pra_bartak_news.2.d: "In a formal ceremony in Prague, Peter Mohammedis has decorated Vladimir Bartak and elevated him to the rank of General. The Directorate presents the appointment as a clear signal of Prague's military resolve."
 pra_bartak_news.2.a: "Prague has gained a formidable commander."
 pra_mohammedis.22.t: "Prague Hinterland Secured"
 pra_mohammedis.22.d: "Czechoslovak authorities have agreed to withdraw their administration from the district immediately outside Prague. Directorate patrols have already moved into the area, securing our roads and depots without incident."
 pra_mohammedis.22.a: "The capital breathes a little easier."

 pra_mohammedis.23.t: "Czechoslovakia Rejects Our Hinterland Demand"
 pra_mohammedis.23.d: "The government in Czechoslovakia has firmly refused our request for the western hinterland district, condemning it as an illegitimate territorial encroachment."
 pra_mohammedis.23.a: "They will learn the cost of obstinacy."

 pra_mohammedis.24.t: "Northern District Transferred"
 pra_mohammedis.24.d: "Czechoslovak officials have yielded the northern district along the old administrative line. Our outposts are now established along the northern railway junctions."
 pra_mohammedis.24.a: "Prague's security corridor expands."

 pra_mohammedis.25.t: "Northern Demand Refused"
 pra_mohammedis.25.d: "Czechoslovakia has refused to concede the northern district, warning Prague against further territorial posturing."
 pra_mohammedis.25.a: "A short-sighted decision."

 pra_mohammedis.26.t: "Central Bohemian Belt Secured"
 pra_mohammedis.26.d: "The central district along the Elbe approach has been ceded to the Directorate. The rail connections and supply lines now answer to our military command."
 pra_mohammedis.26.a: "Our central belt is unbroken."

 pra_mohammedis.27.t: "Central Belt Demand Refused"
 pra_mohammedis.27.d: "Czechoslovakia has rejected our demand for the central district, calling Prague's demands extortion."
 pra_mohammedis.27.a: "They mistake patience for weakness."

 pra_mohammedis.28.t: "The Ultimatum Accepted"
 pra_mohammedis.28.d: "Faced with Prague's military readiness, Czechoslovakia has bowed to the ultimatum. The remaining southwestern approach has been handed over, and our administrative protectorate is recognized."
 pra_mohammedis.28.a: "Prague dictates the terms."

 pra_mohammedis.29.t: "The Ultimatum Defied"
 pra_mohammedis.29.d: "Czechoslovakia has rejected the Prague Ultimatum, preparing to resist any further expansion by force of arms."
 pra_mohammedis.29.a: "Then the guns will speak."

 pra_mohammedis.30.t: "Prague Demands Western Bohemia"
 pra_mohammedis.30.d: "Peter Mohammedis demands the immediate transfer of Western Bohemia, including the crucial industrial city of Plzen and its adjacent districts. The Directorate insists that western industry cannot be left vulnerable under divided command."
 pra_mohammedis.30.a: "We have little choice but to concede."
 pra_mohammedis.30.b: "Plzen remains under Czechoslovak rule!"

 pra_mohammedis.31.t: "Western Bohemia Ceded to Prague"
 pra_mohammedis.31.d: "Czechoslovak authorities have officially handed over Western Bohemia. The factories, railways, and civic institutions of Plzen have raised Prague's standard."
 pra_mohammedis.31.a: "The western gates are secure."

 pra_mohammedis.32.t: "Western Demands Rejected"
 pra_mohammedis.32.d: "Czechoslovakia has rejected our western demands, retaining control over Plzen and the western districts."
 pra_mohammedis.32.a: "They will regret this defiance."

 pra_mohammedis.33.t: "Prague Demands Southern Bohemia"
 pra_mohammedis.33.d: "A formal dispatch from Prague demands the immediate transfer of Tabor and Budweis. The Directorate asserts that the southern roads and administrative centers must be integrated under central military governance."
 pra_mohammedis.33.a: "Concede the southern districts."
 pra_mohammedis.33.b: "We will not surrender the south."

 pra_mohammedis.34.t: "Southern Bohemia Joins the Directorate"
 pra_mohammedis.34.d: "Administrative offices in Tabor and Budweis have transferred control to our commissioners. The southern flank of the capital is now firmly secured."
 pra_mohammedis.34.a: "The south answers to Prague."

 pra_mohammedis.35.t: "Southern Demand Refused"
 pra_mohammedis.35.d: "Czechoslovakia has refused to cede Tabor and Budweis, denouncing Prague's expansion into the south."
 pra_mohammedis.35.a: "An intolerable refusal."

 pra_mohammedis.36.t: "Prague Demands Eastern Bohemia"
 pra_mohammedis.36.d: "Mohammedis insists that the remaining eastern Bohemian districts along the upper Elbe must be unified with the capital to complete the internal security perimeter."
 pra_mohammedis.36.a: "Transfer the eastern districts."
 pra_mohammedis.36.b: "Prague will receive nothing more in the east."

 pra_mohammedis.37.t: "Eastern Bohemia Secured"
 pra_mohammedis.37.d: "Czechoslovak troops have vacated the eastern districts. Directorate officials have assumed control of all road networks and municipal offices up to the traditional border with Moravia."
 pra_mohammedis.37.a: "The entire Bohemian interior is ours."

 pra_mohammedis.38.t: "Eastern Demand Refused"
 pra_mohammedis.38.d: "Czechoslovakia has rejected our eastern demands, barring our inspectors from entering the eastern districts."
 pra_mohammedis.38.a: "Their defiance will cost them dearly."

 pra_mohammedis.39.t: "Prague Demands the Bohemian Borderlands"
 pra_mohammedis.39.d: "The Directorate warns that Czechoslovakia's weakened authority cannot effectively hold the heavily fortified northern and western mountain border. Prague demands that all garrison installations and frontier districts be transferred to Directorate command immediately."
 pra_mohammedis.39.a: "Yield the border fortifications."
 pra_mohammedis.39.b: "The border defenses will never fall to Prague!"

 pra_mohammedis.40.t: "The Borderlands Transferred to Prague"
 pra_mohammedis.40.d: "Direct reports confirm that the mountain bunkers, garrison forts, and frontier towns of northern and western Bohemia are now garrisoned by Prague's legionaries. The natural mountain fortress is unified."
 pra_mohammedis.40.a: "Bohemia's mountain crown is restored."

 pra_mohammedis.41.t: "Borderland Ultimatum Rejected"
 pra_mohammedis.41.d: "Czechoslovakia has rejected our demand for the northern and western frontier zones, locking the bunker complexes against our commanders."
 pra_mohammedis.41.a: "A fatal mistake."

 pra_mohammedis.42.t: "Prague Demands the Southern Borderlands"
 pra_mohammedis.42.d: "To complete the defensive ring around Bohemia, Peter Mohammedis demands the immediate handover of the Sumava border district, completing our defensive line along the southern forest frontier."
 pra_mohammedis.42.a: "Surrender the southern borderland."
 pra_mohammedis.42.b: "We refuse to yield Sumava."

 pra_mohammedis.43.t: "The Southern Borderlands Secured"
 pra_mohammedis.43.d: "Directorate mountain units have occupied the Sumava passes and border stations. The southern frontier of Bohemia is completely secured under Prague's jurisdiction."
 pra_mohammedis.43.a: "Our borders are sealed."

 pra_mohammedis.44.t: "Southern Borderland Refused"
 pra_mohammedis.44.d: "Czechoslovakia has refused to hand over the Sumava borderland, maintaining its garrisons along the southern mountain line."
 pra_mohammedis.44.a: "This dispute is not over."

 pra_mohammedis.45.t: "Prague Has Blamed Us Again"
 pra_mohammedis.45.d: "Dispatches from Prague indicate that the capital's authorities have issued a formal proclamation holding Beneshov responsible for nearly every calamity known to modern statecraft. According to the document, our administration has somehow engineered railway delays, poor harvests, industrial failures, economic instability, climate change, and the ongoing wars in Asia, alongside several other problems clearly beyond the authority of the Beneshov administration.\n\nNo explanation has been offered as to how municipal offices in Beneshov acquired jurisdiction over the weather or the Far East, yet the accusations are being repeated in Prague as established fact."
 pra_mohammedis.45.a: "How is this our fault?"

 pra_news.1.t:0 "Prague Blames Beneshov for Everything"
 pra_news.1.d:0 "The Prague government has formally declared Beneshov responsible for a remarkable range of domestic and international problems.\n\nAccording to the statement, Beneshov is to blame for economic instability, poor harvests, railway delays, wars in Asia, and several other crises. No evidence was presented, but the announcement has proven popular in Prague."
 pra_news.1.a:0 "At last, someone is being held accountable."
