 PRA_antonin_havelka_desc: "A quiet constitutional lawyer who converts the Directorate's decrees into workable orders."
 PRA_ema_vrbova_desc: "A production planner who knows which workshops can meet a deadline and which ones are only making promises."
 PRA_frantisek_novak_desc: "A relentless propagandist who turns every ration queue and parade into proof of the regime's necessity."
 PRA_jaroslav_kral_desc: "An artillery officer who treats Prague's batteries as a single instrument."
 PRA_vaclav_sedivy_desc: "An air organizer who builds warning nets from telephones, observers and stubborn improvisation."
 PRA_alois_simek_desc: "A defensive-minded staff officer who believes every Czech formation should answer to one command."
 PRA_octane: "Octane"
 PRA_octane_desc: "An aggressive infantry commander specializing in rapid breakthrough maneuvers and coordinated assault tactics."
 PRA_vladimir_bartak_army_chief: "Vladimir Bartak"
 PRA_vladimir_bartak_army_chief_desc: "An aggressive and fiercely dedicated commander who leads from the front, instilling uncompromising offensive momentum across the army."

 BEN_matej_dvorak: "Matej Dvorak"
 BEN_matej_dvorak_desc: "A conventional municipal administrator thrust into extraordinary circumstances, Matej Dvorak leads the district council with cautious pragmatism. Facing economic collapse and growing unrest, he remains convinced that Beneshov can endure if its civic institutions stay orderly and disciplined. Whether his faith in municipal procedure can withstand the pressures of total isolation remains an open question."
 BEN_adam_pospisil:0 "Adam Pospisil"
 BEN_adam_pospisil_desc:0 "An obsessive student of operational theory and military simulation with little patience for established political conventions, Adam Pospisil has built a committed following among Beneshov's disenfranchised workers. He approaches statecraft, logistics, and warfare as interconnected components of a grand operational exercise, convinced that scientific planning can succeed where conventional politics has failed. His supporters increasingly share that conviction."
 BEN_stepan_pospisil:0 "Stepan Pospisil"
 BEN_stepan_pospisil_desc:0 "Pragmatic, observant, and thoroughly grounded in the daily realities of the district, Stepan Pospisil serves as the organizational backbone of his brother's political movement. Where formal municipal channels encounter bureaucratic paralysis or shortages, Stepan quietly draws on an extensive personal network of warehouse keepers, railway clerks, and tavern patrons to ensure that supplies continue to move. To the workers of Beneshov, he is simply the man who knows everyone."
 ben_informal_distribution_network:0 "Informal Distribution Network"
 ben_informal_distribution_network_desc:0 "Extensive personal connections across district warehouses, railway sidings, and neighborhood taverns enable flexible, ad-hoc logistics that bypass bureaucratic bottlenecks and keep essential supplies moving."
