 PRA_grznar_advisor: "Grznar"
 PRA_great_leader_desc: "A determined political leader guiding Prague through its uncertain future."
 pra_director_of_national_vitality: "Director of National Vitality"
 pra_director_of_national_vitality_desc: "Channelling raw physical culture, unrelenting discipline, and aggressive public motivation to harden the populace and accelerate national preparedness."
 GRA_reichstag: "The Reichstag"
 GRA_reichstag_desc: "Governing in the name of the Crown, the Supreme High Command serves as the state's highest executive council. Balancing parliamentary oversight with absolute strategic authority, this martial cabinet places the order, defense, and preservation of the monarchical state above all else."
