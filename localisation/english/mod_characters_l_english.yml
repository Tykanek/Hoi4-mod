 PRA_antonin_havelka_desc: "A quiet constitutional lawyer who converts the Directorate's decrees into workable orders."
 PRA_ema_vrbova_desc: "A production planner who knows which workshops can meet a deadline and which ones are only making promises."
 PRA_frantisek_novak_desc: "A relentless propagandist who turns every ration queue and parade into proof of the regime's necessity."
 PRA_jaroslav_kral_desc: "An artillery officer who treats Prague's batteries as a single instrument."
 PRA_vaclav_sedivy_desc: "An air organizer who builds warning nets from telephones, observers and stubborn improvisation."
 PRA_alois_simek_desc: "A defensive-minded staff officer who believes every Czech formation should answer to one command."
