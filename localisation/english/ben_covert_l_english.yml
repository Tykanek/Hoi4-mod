l_english:
 # ============================================================
 # Beneshov Covert Rivalry Focuses
 # ============================================================
 ben_eyes_on_prague:0 "Eyes on Prague"
 ben_eyes_on_prague_desc:0 "The deliveries from Prague have ceased and the capital turns cold toward our district. We must look beyond our borders and plant watchful eyes directly into Prague's administrative, economic, and logistical nerves."
 ben_eyes_on_prague_tt:0 "Unlocks the §YCovert Operations Against Prague§! decision category."

 ben_the_missing_rifles:0 "The Missing Rifles"
 ben_the_missing_rifles_desc:0 "Prague's vast military depots are sprawling and indifferently guarded. With sympathetic stationmasters and falsified transport manifests, several crates of standard infantry rifles can discreetly take a detour to Beneshov."

 ben_follow_the_money:0 "Follow the Money"
 ben_follow_the_money_desc:0 "The municipal treasury in Prague handles millions in bureaucratic allocations. By quietly inserting our accounting agents into the paperwork shuffle, we can siphon administrative funds straight into Beneshov's coffers."

 ben_a_better_life_in_benesov:0 "A Better Life in Beneshov"
 ben_a_better_life_in_benesov_desc:0 "Life under Prague's authoritarian regime is increasingly bleak and regimented. By quietly broadcasting promises of steady employment, cheaper beer, and genuine community, we can entice skilled workers and technicians south."

 ben_the_irregular_migration_scandal:0 "The Irregular Migration Scandal"
 ben_the_irregular_migration_scandal_desc:0 "A minor transit incident on the southern lines offers a golden political weapon. By covertly amplifying rumors, planting vocal agitators, and funding sensationalist leaflets in Prague, we plunge the capital's municipal council into a manufactured panic over uncontrolled African transit corridors."

 ben_the_invisible_hand_of_benesov:0 "The Invisible Hand of Beneshov"
 ben_the_invisible_hand_of_benesov_desc:0 "Our clandestine operations against Prague are no longer isolated stunts. We have established an enduring underground syndicate capable of manipulating the capital's markets, administration, and public opinion at will."

 ben_a_city_that_bleeds_its_rival:0 "A City That Bleeds Its Rival"
 ben_a_city_that_bleeds_its_rival_desc:0 "Every rifle redirected south, every embezzled crown, and every defecting mechanic compounds Prague's stagnation while fueling Beneshov's relentless ascension. Prague bleeds so that Beneshov may thrive."

 ben_the_prague_files:0 "The Prague Files"
 ben_the_prague_files_desc:0 "Years of covert surveillance have yielded a master dossier: conclusive proof of bribery, embezzled public works, and gross negligence by Prague's municipal leadership. The time has come to present our terms."

 # ============================================================
 # National Spirits & Modifiers
 # ============================================================
 ben_eyes_on_prague_spirit:0 "Prague Surveillance Network"
 ben_eyes_on_prague_spirit_desc:0 "Clandestine Beneshov lookouts and listening posts maintain constant observation over transit routes and government offices in Prague."

 ben_master_infiltrators:0 "Master Infiltrators"
 ben_master_infiltrators_desc:0 "Beneshov's underground operatives operate with supreme confidence, running rings around Prague's clumsy municipal gendarmes."

 ben_bleeding_prague:0 "Bleeding the Rival"
 ben_bleeding_prague_desc:0 "By systematically siphoning economic and material vitality from Prague, Beneshov expands its domestic output at the capital's expense."

 ben_prague_defector_engineers:0 "Prague Defector Engineers"
 ben_prague_defector_engineers_desc:0 "Skilled technical specialists who fled Prague's harsh working regime have brought valuable manufacturing patents and engineering know-how to Beneshov."

 pra_bureaucratic_migration_scandal:0 "Bureaucratic Migration Crisis"
 pra_bureaucratic_migration_scandal_desc:0 "Planted rumors, fabricated transit manifests, and public outrage have paralyzed Prague's municipal council in endless emergency debates."

 pra_disinformation_turmoil:0 "Disinformation Wave"
 pra_disinformation_turmoil_desc:0 "Coordinated smear campaigns and subversive leaflets distributed by Beneshov agents have severely undermined public trust in city authorities."

 pra_arsenal_fortified:0 "Fortified Armories"
 pra_arsenal_fortified_desc:0 "Stringent security procedures and armed patrols protect military warehouses against foreign sabotage."

 pra_infiltrators_purged:0 "Security Crackdown"
 pra_infiltrators_purged_desc:0 "Prague authorities have purged suspect municipal employees and tightened surveillance across the district border."

 # ============================================================
 # Decision Categories & Decisions
 # ============================================================
 ben_covert_operations_against_prague:0 "Covert Operations Against Prague"
 ben_covert_operations_against_prague_desc:0 "While Prague postures with military drills and aggressive speeches, Beneshov wage an invisible campaign in the shadows. Through calculated thefts, economic siphoning, and psychological warfare, we chip away at the capital's strength."

 ben_op_steal_infantry_equipment:0 "Raid Prague Armories"
 ben_op_steal_infantry_equipment_desc:0 "Bribe warehouse guards in Prague to look the other way while our night squads load military crates onto outgoing freight trains."

 ben_op_divert_funds:0 "Siphon Administrative Revenue"
 ben_op_divert_funds_desc:0 "Reroute tax collections and procurement surpluses from Prague's municipal bureaucracy directly into the Beneshov district budget."

 ben_op_recruit_defectors:0 "Recruit Disillusioned Prague Technicians"
 ben_op_recruit_defectors_desc:0 "Dispatch covert recruiters to contact underpaid factory foremen and railway mechanics in Prague, offering them lucrative positions in Beneshov."

 ben_op_disinformation_campaign:0 "Launch Disinformation Campaign"
 ben_op_disinformation_campaign_desc:0 "Flood the streets of Prague with incendiary pamphlets highlighting administrative incompetence, rationing shortages, and high-level corruption."

 ben_op_political_scandal:0 "Manufacture Prague Municipal Crisis"
 ben_op_political_scandal_desc:0 "Orchestrate an explosive public controversy inside Prague's city hall, forcing municipal directors to fight among themselves or spend lavish bribes to preserve order."

 pra_counter_espionage_measures:0 "Countering Beneshov Espionage"
 pra_counter_espionage_measures_desc:0 "The insolent provincial troublemakers in Beneshov are actively attempting to undermine order in the capital. We must secure our armories and purge enemy sympathizers."

 pra_audit_central_arsenal:0 "Fortify Strategic Depots"
 pra_audit_central_arsenal_desc:0 "Double the guards on all arms warehouses and implement mandatory sign-offs for every rifle leaving storage."

 pra_purge_infiltrators:0 "Root Out Foreign Provocateurs"
 pra_purge_infiltrators_desc:0 "Order the city police to round up known Beneshov agitators, union troublemakers, and unauthorized pamphleteers."

 # ============================================================
 # Events
 # ============================================================
 ben_covert.1.t:0 "Crates from Prague Arrive"
 ben_covert.1.d:0 "Under cover of darkness, three unmarked boxcars arrived at the Beneshov siding. Inside, district warehouse crews found hundreds of freshly oiled infantry rifles still marked with Prague municipal ordnance stamps. The paperwork in the capital has been thoroughly scrambled; by the time anyone notices the inventory shortfall, the weapons will already be distributed to our garrison."
 ben_covert.1.a:0 "Every rifle counts."

 ben_covert.2.t:0 "Audit Discovers Empty Racks"
 ben_covert.2.d:0 "An unexpected morning inventory inspection at the central Prague ordnance depot has uncovered a humiliating discrepancy: dozens of rifle crates have completely vanished from Section 4. The logs claim they were dispatched for scheduled maintenance in Beneshov, but municipal records indicate no such maintenance was ever commissioned."
 ben_covert.2.a:0 "Incompetent fools! How did 250 rifles vanish?"

 ben_covert.3.t:0 "Prague Tax Funds Diverted"
 ben_covert.3.d:0 "Our network of friendly clerks in Prague's municipal treasury has successfully completed a series of creative accounting maneuvers. A sizable tranche of municipal administrative revenue has been discreetly transferred into Beneshov's municipal accounts under the guise of an overdue regional drainage subsidy."
 ben_covert.3.a:0 "Prague's citizens generously fund our future."

 ben_covert.4.t:0 "Treasury Shortfall Discovered"
 ben_covert.4.d:0 "Prague's chief financial auditor burst into the municipal director's office pale and sweating. A routine ledger audit revealed that fifty thousand crowns earmarked for bureaucratic operating expenses have been wired south under a forged seal. By all accounts, the money is already gone."
 ben_covert.4.a:0 "Find whoever approved that transfer!"

 ben_covert.5.t:0 "The Prague Influx"
 ben_covert.5.d:0 "Tired of ration queues, authoritarian decrees, and constant police interrogations in the capital, hundreds of working families from Prague have packed their belongings and boarded trains south to Beneshov. Our district reception committee greeted them with temporary housing, employment papers, and a warm meal."
 ben_covert.5.a:0 "Welcome to a real community."

 ben_covert.6.t:0 "The Migration Controversy"
 ben_covert.6.d:0 "Prague's city hall descended into shouting matches today after local newspapers ran sensationalist front-page exposés alleging that city officials covertly permitted undocumented transit corridors from Africa to enter the capital. Planted agitators in the public gallery heckled the municipal directors, demanding immediate resignations and emergency investigations. While the reports are largely exaggerated by outside provocateurs, the public uproar is intensely real."
 ben_covert.6.a:0 "Denounce the agitators and order an emergency inquiry."
 ben_covert.6.b:0 "Ignore the rabble and let them tire themselves out."

 ben_covert.7.t:0 "Prague Council Paralyzed"
 ben_covert.7.d:0 "Reports from our agents in the capital confirm complete pandemonium at the Prague municipal council. The directors have suspended normal administrative business to accuse one another of secret complicity in the migration controversy. While they trade frantic insults in the chamber, our own municipal work proceeds without interruption."
 ben_covert.7.a:0 "A magnificent distraction."

 ben_covert.8.t:0 "The Invisible Hand"
 ben_covert.8.d:0 "What began as desperate opportunism has matured into an invisible empire of informants, sympathetic railwaymen, and subverted bureaucrats. There is no major office in Prague where Beneshov does not have a friend, and no warehouse schedule we cannot read in advance. The capital believes itself mighty, but it dances on strings pulled from Beneshov."
 ben_covert.8.a:0 "The shadows belong to us."

 ben_covert.10.t:0 "The Prague Dossier"
 ben_covert.10.d:0 "Our intelligence service has completed the final assembly of 'The Prague Files.' Within these thick leather folders lies unassailable evidence of high-level embezzlement, forged election ballots, and secret kickbacks paid to Prague's senior municipal directors. If made public, the scandal would devastate the regime's legitimacy. We now hold the ultimate lever over our rival: do we extract heavy economic reparations in exchange for silence, or publish the files to crush their stability once and for all?"
 ben_covert.10.a:0 "Demand secret industrial reparations and funds."
 ben_covert.10.b:0 "Publish everything. Ruin their government."

 ben_covert.11.t:0 "Blackmail from Beneshov"
 ben_covert.11.d:0 "A courier from Beneshov arrived with a sealed envelope addressed exclusively to the highest authorities in Prague. Inside were carbon copies of damning financial ledgers, private diaries, and secret slush-fund agreements. The attached demand is blunt: transfer significant political concessions and industrial machinery south, or the entire file will be published across every newspaper in Bohemia."
 ben_covert.11.a:0 "Pay the extortionists. We cannot survive this exposure."

 ben_covert.12.t:0 "The Prague Files Published"
 ben_covert.12.d:0 "Thousands of illicit copies of 'The Prague Dossier' appeared on the streets of Prague overnight, posted on tram stops, factory gates, and church doors. The revelations of rampant graft and corruption at the highest levels of city hall have ignited widespread strikes, angry protests, and profound demoralization across the population."
 ben_covert.12.a:0 "A catastrophe for our authority!"

 ben_covert.20.t:0 "Prague Depot Raid Successful"
 ben_covert.20.d:0 "Our operatives completed the warehouse raid in Prague without incident. Another shipment of military equipment has been secured for Beneshov's armories."
 ben_covert.20.a:0 "Excellent work."

 ben_covert.21.t:0 "Funds Successfully Diverted"
 ben_covert.21.d:0 "The administrative transfer from Prague cleared without triggering alarms. Beneshov's treasury has been replenished."
 ben_covert.21.a:0 "Splendid."

 ben_covert.22.t:0 "New Specialists Arrive"
 ben_covert.22.d:0 "A fresh contingent of skilled mechanics and technicians from Prague arrived at the central station today, eager to contribute to Beneshov's growing industries."
 ben_covert.22.a:0 "Put them to work."

 ben_covert.23.t:0 "Disinformation Takes Root"
 ben_covert.23.d:0 "Panic and distrust are spreading through the neighborhoods of Prague following the distribution of our latest pamphlets. Prague officials are scrambling to issue denials that nobody believes."
 ben_covert.23.a:0 "Let them squirm."

 ben_covert.24.t:0 "Scandal Erupts in Prague"
 ben_covert.24.d:0 "Our engineered controversy has exploded across Prague's civic institutions, forcing their leaders to divert precious political energy into damage control."
 ben_covert.24.a:0 "According to plan."

 pra_covert_counter.1.t:0 "Arsenal Intrusion Detected"
 pra_covert_counter.1.d:0 "Night guards at the municipal armory reported forced locks and missing crates. Footprints and vehicle tracks suggest the perpetrators headed south toward the district line."
 pra_covert_counter.1.a:0 "Double the guards and log the theft!"

 pra_covert_counter.2.t:0 "City Hall in Crisis"
 pra_covert_counter.2.d:0 "Leaked documents and explosive public allegations have created an acute political crisis in Prague. Council members are frantically trading blame, and journalists are camped outside city hall."
 pra_covert_counter.2.a:0 "Spend the necessary funds to hush up the press."
 pra_covert_counter.2.b:0 "We refuse to negotiate. Weather the storm."

 pra_covert_counter.3.t:0 "Audit Uncovers Ledger Leaks"
 pra_covert_counter.3.d:0 "A forensic review of Prague's treasury accounts revealed suspicious transactions siphoning funds outside the capital. Internal investigations are underway."
 pra_covert_counter.3.a:0 "Tighten financial oversight immediately."

 # --- New Custom Tooltips & Fallbacks ---
 ben_op_pra_arsenals_not_fortified_tt:0 "§RPrague's central armories are currently under fortified military guard.§!"
 pra_has_sufficient_pp_tt:0 "§RPrague treasury has at least 50 Political Power to divert.§!"
 pra_infiltrators_not_purged_tt:0 "§RPrague police are conducting an active anti-espionage crackdown.§!"
 pra_has_sufficient_manpower_tt:0 "§RPrague has at least 400 available manpower in reserve.§!"

 ben_archived_trade_ledgers:0 "Archived Commercial Ledgers"
 ben_archived_trade_ledgers_desc:0 "Salvaged municipal accounting ledgers provide valuable insights into regional supply networks and commercial arrangements."

 ben_covert.25.t:0 "Prague Depots Inactive"
 ben_covert.25.d:0 "Our reconnaissance squad found the storage depots in Prague empty and inactive. Without military equipment to divert, our scouts thoroughly mapped the district transport nodes, providing our staff with valuable operational experience."
 ben_covert.25.a:0 "Take note of the terrain."

 ben_covert.26.t:0 "Prague Treasury Depleted"
 ben_covert.26.d:0 "Our financial infiltrators report that Prague's municipal accounts are completely drained or inaccessible. Rather than returning empty-handed, our agents recovered historical trade contracts and merchant directories."
 ben_covert.26.a:0 "Knowledge is valuable in its own right."

 ben_covert.27.t:0 "Focusing on Our Own Workers"
 ben_covert.27.d:0 "With Prague unable or unwilling to spare working hands, Beneshov's municipal council redirected administrative focus toward local district welfare and community solidarity."
 ben_covert.27.a:0 "Beneshov relies on its own strength."
