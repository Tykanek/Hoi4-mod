l_english:
 benesov.1.t:0 "The Fate of Benešov"
 benesov.1.d:0 "As Czechoslovak authority weakens across the provinces, the municipal leadership of Benešov finds itself at an existential crossroads. Mayor Matěj Dvořák argues that our small district lacks the industry and manpower to survive on its own, urging the council to reaffirm loyal ties with Prague. However, local shopkeepers, veterans, and municipal councilors increasingly demand that Benešov stand alone, calling for an immediate break from the republic."
 benesov.1.a:0 "The council must weigh its options."

 benesov.2.t:0 "Benešov Declares Independence"
 benesov.2.d:0 "Led by Mayor Matěj Dvořák, the Benešov municipal council has taken the historic step of terminating all autonomous protectorate ties with Czechoslovakia. Federal customs agents and military observers have been formally escorted to the district border. While cheering citizens crowd Masaryk Square under local banners, the sudden cessation of national trade and supply deliveries promises severe economic hardship in the days ahead."
 benesov.2.a:0 "Benešov stands on its own feet."

 benesov.3.t:0 "The Beer Rationing Debate"
 benesov.3.d:0 "The economic shock of independence has hit Benešov quickly, with stockpiles of coal, flour, and industrial raw materials dwindling. In an emergency town meeting, councilors have locked horns over how to maintain civilian order. Rejecting calls for strict rationing, Dvořák's government has introduced the Public Morale Programme, heavily subsidizing municipal tavern rations to ensure that cheap beer keeps the anxious population calm."
 benesov.3.a:0 "Keep the beer flowing."

 benesov.4.t:0 "The Strategist of Benešov"
 benesov.4.d:0 "In the back rooms of municipal taverns and working-class meeting halls, a charismatic young organizer named Adam Pospíšil has begun drawing devoted crowds. Surrounding himself with detailed operational charts, logistics formulas, and grand military treatises, Pospíšil delivers scathing critiques of Dvořák's liberal paralysis. He argues that Benešov's crisis cannot be solved by beer subsidies, but only through rigorous scientific planning and the revolutionary mobilization of the working class."
 benesov.4.a:0 "His arguments carry undeniable weight."

 benesov.5.t:0 "Dvořák Has Lost the Streets"
 benesov.5.d:0 "A wave of mass strikes, organized through tavern networks and railway yards, has brought Benešov to a complete standstill. Local police detachments have refused Mayor Dvořák's orders to disperse demonstrators, instead joining the strike committees. With Town Hall surrounded and revolutionary delegates running neighbourhood distribution points, it is clear that Dvořák's democratic administration has lost control of the streets."
 benesov.5.a:0 "The old administration has collapsed."

 benesov.6.t:0 "Proclamation of the People's Republic"
 benesov.6.d:0 "Red banners now drape the municipal building as Adam Pospíšil steps onto the town hall balcony to address a jubilant assembly of armed workers and citizens. Formally assuming executive authority, Pospíšil proclaims the People's Republic of Benešov, pledging to sweep away bourgeois stagnation, mobilize regional industry, and construct a scientific socialist stronghold in the heart of Bohemia."
 benesov.6.a:0 "Long live the People's Republic!"

 benesov_news.1.t:0 "Benešov Returns to Czechoslovakia"
 benesov_news.1.d:0 "Following constructive negotiations between Prague and municipal leaders under Matěj Dvořák, the autonomous territory of Benešov has formally surrendered its separate status and rejoined the Czechoslovak Republic as a fully integrated district. The peaceful reintegration has been welcomed in Prague as a vital reaffirmation of national unity."
 benesov_news.1.a:0 "The republic remains whole."

 benesov_news.2.t:0 "Benešov Declares Independence"
 benesov_news.2.d:0 "The autonomous district of Benešov has officially declared its complete independence from the Czechoslovak Republic. Municipal authorities under Mayor Matěj Dvořák have expelled federal supervisors, established border posts, and proclaimed full district sovereignty. Observers in Prague have protested the secession, warning that the small landlocked territory cannot long survive without access to federal supply networks."
 benesov_news.2.a:0 "An unexpected fracture in Central Europe."
