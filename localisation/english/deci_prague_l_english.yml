l_english:

 pra_vo_supply_operations: "Strašnice Supply Operations"
 pra_vo_supply_operations_desc: "With the civilian administration increasingly incapable of maintaining regular deliveries, Strašnice has begun establishing its own network of warehouses, ration stations and transport detachments."

 pra_seize_government_warehouses: "Seize Government Warehouses"
 pra_seize_government_warehouses_desc: "Supplies sitting behind locked doors are useless to a starving city. Strašnice detachments will take possession of government stocks and redirect whatever can serve our armed formations."

 pra_secure_coal_depots: "Secure the Coal Depots"
 pra_secure_coal_depots_desc: "Fuel and coal reserves must be protected from hoarding, theft and political interference. Strašnice will place the city's remaining strategic fuel stocks under armed guard."

 pra_distribute_emergency_rations: "Distribute Emergency Rations"
 pra_distribute_emergency_rations_desc: "Food bearing Strašnice's black banners will reach districts where municipal distribution has broken down. Every ration handed out is another reminder of who is actually keeping Prague alive."

 pra_reserve_mobilization: "Reserve Mobilization"
 pra_reserve_mobilization_desc: "Recruitment offices turn Prague's districts and veterans into organized reserves."
 pra_open_recruitment_office: "Open Recruitment Offices"
 pra_open_recruitment_office_desc: "Create district offices in Žižkov, Karlín and the surrounding wards."
 pra_recruit_zhizkov_volunteers: "Recruit Žižkov Volunteers"
 pra_recruit_zhizkov_volunteers_desc: "The workers of Žižkov answer the call with rifles and resolve."
 pra_recruit_karlin_volunteers: "Recruit Karlín Volunteers"
 pra_recruit_karlin_volunteers_desc: "Karlín's depots and workshops provide men for the reserve."
 pra_call_legionary_veterans: "Call the Legionary Veterans"
 pra_call_legionary_veterans_desc: "Former legionaries will return to the colors as instructors and cadre."

 pra_salvage_programme: "Nothing Leaves the Scrap Yard"
 pra_salvage_programme_desc: "Prague will recover every usable tool, gun and crate from its neglected stores."
 pra_strip_abandoned_warehouses: "Strip Abandoned Warehouses"
 pra_strip_abandoned_warehouses_desc: "Search sealed depots for serviceable infantry equipment."
 pra_reclaim_damaged_guns: "Reclaim Damaged Guns"
 pra_reclaim_damaged_guns_desc: "Repair artillery that other administrations have written off."

 pra_directorate_propaganda: "Directorate Propaganda Bureau"
 pra_directorate_propaganda_desc: "The new state will make its case through radio, posters and the black bulletin."
 pra_broadcast_the_directorate: "Broadcast the Directorate"
 pra_broadcast_the_directorate_desc: "A steady voice and visible deliveries can turn fear into acceptance."
 pra_publish_the_black_bulletin: "Publish the Black Bulletin"
 pra_publish_the_black_bulletin_desc: "Every district will receive the Directorate's version of events and orders."

 pra_bohemian_protectorate: "The Bohemian Protectorate"
 pra_bohemian_protectorate_desc: "Prague's programme for bringing the Czech approaches under one command."
 pra_integrate_czech_officers: "Integrate Czech Officers"
 pra_integrate_czech_officers_desc: "Prepare the staff and manpower needed for a reunified Czech command."

 pra_strasnice_military_command: "Strašnice Military Command"
 pra_strasnice_military_command_desc: "With the Directorate consolidating its grip over Prague, the armed veterans and elite operatives of the Strašnice movement must be organized under decisive battlefield leadership."
 pra_promote_vladimir_bartak: "Evaluate Field Command for Vladimír Barták"
 pra_promote_vladimir_bartak_desc: "Vladimír Barták is recognized as an exceptionally skilled combatant and military operative. The Directorate is considering elevating him from intelligence and political advisory duties into direct command of Prague's field divisions."

 pra_integration_of_czech_lands: "Integration of the Czech Lands"
 pra_integration_of_czech_lands_desc: "The Directorate has acquired territory faster than its civil administration can organically absorb it. Former Czechoslovak municipal councils, police commands, judicial bodies, rail hubs, and regional loyalties must be systematically subordinated to Prague's central authority before these lands can be fully organized as integral components of our state."

 pra_integrate_state_9: "Integrate Plzeň"
 pra_integrate_state_9_desc: "Subordinate local municipal offices, rail depots, and industrial facilities in Plzeň directly to Directorate administrators, binding the region firmly to Prague."
 pra_integrate_state_69: "Integrate North Sudetenland"
 pra_integrate_state_69_desc: "Establish direct military governorship and administrative control over the northern frontier districts, integrating them into the Directorate defense perimeter."
 pra_integrate_state_972: "Integrate South Sudetenland"
 pra_integrate_state_972_desc: "Incorporate the southern border redoubts and mountain passes into Prague's centralized command network."
 pra_integrate_state_1086: "Integrate Bohemian District - 6592"
 pra_integrate_state_1086_desc: "Consolidate Directorate authority across the western approach district, absorbing municipal administration into our unified state."
 pra_integrate_state_1087: "Integrate Bohemian District - 9421"
 pra_integrate_state_1087_desc: "Formalize central administrative control over the northern approach district, securing the regional supply network."
 pra_integrate_state_1088: "Integrate Bohemian District - 6440"
 pra_integrate_state_1088_desc: "Reorganize local district councils and industrial assets under the authority of the Directorate."
 pra_integrate_state_1089: "Integrate Bohemian District - 9414"
 pra_integrate_state_1089_desc: "Incorporate district governance and road junctions into the central Prague administrative apparatus."
 pra_integrate_state_1090: "Integrate Bohemian District - 9429"
 pra_integrate_state_1090_desc: "Subordinate the southern administrative district directly to Directorate ministries."
 pra_integrate_state_1091: "Integrate Tábor"
 pra_integrate_state_1091_desc: "Restore orderly administration over the historic southern strongholds, binding Tábor directly to Prague."
 pra_integrate_state_1092: "Integrate Budweis"
 pra_integrate_state_1092_desc: "Establish firm Directorate control over the administrative centers and transport hubs of Budweis."
 pra_integrate_state_1093: "Integrate Benešov"
 pra_integrate_state_1093_desc: "Dismantle rival administrative holdouts and fully integrate the pacified district of Benešov into the central state."
 pra_integrate_state_1094: "Integrate Bohemian District - 583"
 pra_integrate_state_1094_desc: "Incorporate eastern Bohemian municipal bodies and communications networks into the Directorate system."
 pra_integrate_state_1095: "Integrate Bohemian District - 445"
 pra_integrate_state_1095_desc: "Extend centralized administration and taxation authority across the eastern approach district."
 pra_integrate_state_1096: "Integrate Bohemian District - 494"
 pra_integrate_state_1096_desc: "Subordinate regional garrisons and district administration directly to Prague's command."
 pra_integrate_state_1097: "Integrate Bohemian District - 3462"
 pra_integrate_state_1097_desc: "Secure the northeastern approach district under permanent Directorate governance."
 pra_integrate_state_1098: "Integrate Northwestern Bohemia District"
 pra_integrate_state_1098_desc: "Establish direct Directorate authority over the northwestern frontier valleys and defensive posts."
 pra_integrate_state_1099: "Integrate Liberec District"
 pra_integrate_state_1099_desc: "Integrate municipal administration, rail stations, and civil defense in the Liberec district under central command."
 pra_integrate_state_1100: "Integrate North Bohemian Corridor"
 pra_integrate_state_1100_desc: "Consolidate administrative control over the critical northern transport corridor, securing it as an integral core of Prague."
 pra_integrate_state_1101: "Integrate Ústí District"
 pra_integrate_state_1101_desc: "Incorporate the industrial plants and river navigation authorities of Ústí under direct state supervision."
